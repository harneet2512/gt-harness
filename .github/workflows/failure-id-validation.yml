name: Failure ID integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pinned failure ledger and repository references
        run: >-
          python scripts/validate_failure_ids.py .
          --ledger-snapshot config/failure_id_ledger_snapshot.json
          --expected-ledger-revision sha256:b9828534a6ca2b1e935fc795e54505f25b958c28ae5a415fe147fe9cde103507
          --expected-next FD-031
