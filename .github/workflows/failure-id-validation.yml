name: Failure ID integrity

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate pinned failure ledger and repository references
        run: >-
          python scripts/validate_failure_ids.py .
          --ledger-snapshot config/failure_id_ledger_snapshot.json
          --expected-ledger-revision sha256:86fe88f99aef31db9214a9c82364936fb1523a465043aee0c3b325fa823c6eb6
          --expected-ledger-payload-sha256 3aefe224c70975266cdc777d231bc4ecb8b3fa38e98d7921d4ffcb5f6a2c7592
          --expected-next FD-031
