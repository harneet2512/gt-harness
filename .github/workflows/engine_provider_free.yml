# Inline Engine provider-free certification (IE-13).
#
# Zero provider calls: installs the harness + GroundTruth producer from the
# frozen commit, runs the engine test battery, the 129-row inventory audit,
# the compliance certificates, and the finalstand document validator.
#
# Dispatch only:
#   gh workflow run engine_provider_free.yml -R harneet2512/gt-harness \
#       -f ref=inline-engine -f groundtruth_ref=<immutable commit>
name: Inline Engine provider-free certification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Repository ref to check out (the ENGINE code)"
        type: string
        default: "inline-engine"
      groundtruth_ref:
        description: "Immutable 40-hex GroundTruth commit"
        type: string
        default: "61cfdbce2c42751c11028e46e863b3231f0bb70e"

jobs:
  provider_free:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      GROUNDTRUTH_REF: ${{ inputs.groundtruth_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install harness + deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,miniswe]" "harbor==0.20.0" hypothesis

      - name: Checkout + install GroundTruth producer (frozen commit)
        run: |
          git clone --quiet https://github.com/harneet2512/groundtruth.git Groundtruth
          git -C Groundtruth checkout --quiet "$GROUNDTRUTH_REF"
          pip install -q ./Groundtruth
          python - <<'EOF'
          import groundtruth
          print("groundtruth import OK")
          EOF

      - name: Engine test battery (provider-free)
        run: |
          python -m pytest tests/test_engine_contracts.py \
            tests/test_engine_transitions.py \
            tests/test_engine_decide.py \
            tests/test_engine_observe.py \
            tests/test_engine_mutation.py \
            tests/test_engine_runner.py \
            tests/test_engine_129_audit.py \
            tests/test_engine_compliance.py \
            tests/test_engine_force_17.py \
            tests/test_engine_gates.py \
            tests/test_engine_interface.py \
            tests/test_engine_visibility.py \
            tests/test_engine_e2e_smoke.py \
            -q

      - name: 16-feature visibility matrix
        run: |
          python scripts/engine_visibility.py

      - name: READINESS audit (Gate 1) — 17x6 matrix from observed bytes
        run: |
          python scripts/engine_readiness_audit.py

      - name: META-audit (Gate 2) — mutation tests prove the audit can't lie
        run: |
          python scripts/engine_meta_audit.py

      - name: 129-row inventory audit
        run: |
          python scripts/engine_129_audit.py --check

      - name: Finalstand document validator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/validate_gt_finalstand.py

      - name: Engine compliance certificates
        run: |
          python - <<'EOF'
          from gt_engine.engine.compliance import (
              engine_import_closure, perf_passivity,
              registered_owner_consistency, verify_engine_delivery_events,
          )
          from scripts.engine_129_audit import build_transition_rows

          rows, _ = build_transition_rows()
          errors = perf_passivity(rows) + registered_owner_consistency()
          violations = engine_import_closure()
          ok, replay_issues = verify_engine_delivery_events([])
          problems = errors + violations
          if problems:
              for p in problems:
                  print("error:", p)
              raise SystemExit(1)
          print("engine compliance OK: perf passive, owners registered, "
                "import closure clean, delivery replay certified")
          EOF

      - name: Machine-readable receipt
        if: always()
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path
          receipt = {
              "schema": "gt.engine.provider_free.v1",
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "ref": "${{ inputs.ref }}",
              "groundtruth_ref": os.environ.get("GROUNDTRUTH_REF", ""),
              "provider_calls": 0,
          }
          Path("engine_provider_free_receipt.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          print(json.dumps(receipt))
          EOF

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-provider-free-${{ github.run_id }}
          path: engine_provider_free_receipt.json
          if-no-files-found: warn
