name: TB2 Mini-SWE Ox Alpha smoke20 (20 tasks, 20 parallel)

# This is the canonical prerelease Ox Alpha smoke. Harbor runs the production
# MiniSweCentralAgent; each task gets its own GitHub runner. The task set is
# loaded from the hash-bound ox_alpha_smoke20 release contract, so a dispatch
# cannot accidentally become the 89-task dataset or use a different order.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Exact provider catalog model ID"
        type: string
        default: "stealth/ox-alpha"
      base_url:
        description: "OpenAI-compatible provider base URL"
        type: string
        default: "https://openrouter.ai/api/v1"
      provider_secret:
        description: "Repository Actions secret containing the provider key"
        type: string
        default: "OPENROUTER_NEW"
      temperature:
        description: "Mini-SWE sampling temperature"
        type: string
        default: "1"
      code_ref:
        description: "Exact branch or commit containing the Mini-SWE GT code"
        type: string
        default: ""
      job_name:
        description: "Optional Harbor job-name prefix"
        type: string
        default: "tb2-miniswe-ox-alpha-smoke20"

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  GH_TOKEN: ${{ github.token }}
  OPENAI_API_KEY: ${{ secrets[inputs.provider_secret] }}
  OPENAI_BASE_URL: ${{ inputs.base_url }}
  GT_LITELLM_MODEL: ${{ inputs.model }}
  GT_EXPECTED_RESPONSE_MODEL: ${{ inputs.model }}
  GT_EXPECTED_ADAPTER_PROVIDER: openai
  # This is the release route identity, not a workflow/display label.  The
  # runtime certificate requires provider:native:host and rejects arbitrary
  # middle segments so receipts cannot claim an unapproved execution path.
  GT_PROVIDER_ROUTE_ID: openrouter:native:openrouter.ai
  GT_DENSE_INTRA_OP_THREADS: "4"
  GT_DENSE_INTER_OP_THREADS: "1"
  MSWEA_SILENT_STARTUP: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      task_count: ${{ steps.plan.outputs.task_count }}
      task_set_sha256: ${{ steps.plan.outputs.task_set_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Harbor for dataset planning
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "harbor==0.20.0" "mini-swe-agent==2.2.8"

      - name: Verify exact Ox Alpha Mini-SWE tool route
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import litellm
          from minisweagent.models.litellm_model import BASH_TOOL

          model = os.environ["GT_LITELLM_MODEL"]
          litellm_model = model
          if os.environ["OPENAI_BASE_URL"] and not litellm_model.startswith("openai/"):
              litellm_model = f"openai/{litellm_model}"
          response = litellm.completion(
              model=litellm_model,
              api_base=os.environ["OPENAI_BASE_URL"],
              api_key=os.environ["OPENAI_API_KEY"],
              messages=[{"role": "user", "content": "Use bash to run: printf ID_OK"}],
              tools=[BASH_TOOL],
              tool_choice={"type": "function", "function": {"name": "bash"}},
              temperature=float("${{ inputs.temperature }}"),
              max_tokens=64,
              num_retries=0,
          )
          payload = response.model_dump() if hasattr(response, "model_dump") else response
          choice = (payload.get("choices") or [{}])[0]
          calls = ((choice.get("message") or {}).get("tool_calls") or [])
          if payload.get("model") != model:
              raise SystemExit(f"served model mismatch: {payload.get('model')!r}")
          if not calls or calls[0].get("function", {}).get("name") != "bash":
              raise SystemExit("provider did not return the Mini-SWE bash tool call")
          print(json.dumps({
              "schema": "gt.tb2.ox-alpha.tool-preflight.v1",
              "model": payload.get("model"),
              "provider": "openrouter",
              "finish_reason": choice.get("finish_reason"),
              "tool_name": calls[0]["function"]["name"],
              "response_id": payload.get("id"),
          }, sort_keys=True))
          PY

      - name: Resolve exact release-bound 20-task contract
        id: plan
        run: |
          set -euo pipefail
          harbor dataset download terminal-bench@2.0 -o tb2-cardinality --export
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          contract = json.loads(Path("eval/release/ox_alpha_smoke20.json").read_text())
          benchmark = contract["benchmark_contract"]
          if benchmark["workflow"] != "tb2_miniswe_ox_alpha_diagnostic.yml":
              raise SystemExit("release contract is not bound to this Mini-SWE workflow")
          if benchmark["agent"] != "eval.gt_central_agent:MiniSweCentralAgent":
              raise SystemExit("release contract is not bound to MiniSweCentralAgent")
          tasks = list(benchmark["task_ids"])
          if len(tasks) != 20 or len(set(tasks)) != 20:
              raise SystemExit(f"expected 20 unique contract tasks, found {len(tasks)}")
          root = Path("tb2-cardinality/terminal-bench")
          available = {path.name for path in root.iterdir() if path.is_dir()}
          missing = sorted(set(tasks) - available)
          if missing:
              raise SystemExit(f"contract tasks absent from dataset: {missing}")
          # One matrix row per task gives task-level status and artifacts while
          # max-parallel below allows the complete 20-task smoke to run at once.
          matrix_rows = [{"ordinal": i, "task": task} for i, task in enumerate(tasks)]
          task_hash = hashlib.sha256(
              json.dumps(tasks, separators=(",", ":")).encode()
          ).hexdigest()
          matrix = json.dumps({"include": matrix_rows}, separators=(",", ":"))
          Path("tb2-task-plan.json").write_text(
              json.dumps({"task_count": len(tasks), "tasks": tasks,
                          "task_set_sha256": task_hash, "matrix": matrix_rows}, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={matrix}\n")
              out.write(f"task_count={len(tasks)}\n")
              out.write(f"task_set_sha256={task_hash}\n")
          print(f"TB2_TASK_COUNT={len(tasks)}")
          print(f"TB2_TASK_SET_SHA256={task_hash}")
          print(f"TB2_MATRIX_ROWS={len(matrix_rows)}")
          PY

      - name: Upload task plan
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-ox-alpha-task-plan-${{ github.run_id }}
          path: tb2-task-plan.json
          if-no-files-found: error

  task:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 600
    env:
      MODEL: ${{ inputs.model }}
      TEMPERATURE: ${{ inputs.temperature }}
      JOB_PREFIX: ${{ inputs.job_name }}
      TASK: ${{ matrix.task }}
      ORDINAL: ${{ matrix.ordinal }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Authenticate Docker Hub account for task image pulls
        env:
          DOCKERHUB_USERNAME_PRIMARY: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN_PRIMARY: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME_ROTATION: ${{ secrets.DOCKERHUB_USERNAME_ROTATION }}
          DOCKERHUB_TOKEN_ROTATION: ${{ secrets.DOCKERHUB_TOKEN_ROTATION }}
        run: |
          set -euo pipefail
          if [ "$(( ORDINAL % 2 ))" -eq 0 ]; then
            user="$DOCKERHUB_USERNAME_PRIMARY"
            token="$DOCKERHUB_TOKEN_PRIMARY"
          else
            user="$DOCKERHUB_USERNAME_ROTATION"
            token="$DOCKERHUB_TOKEN_ROTATION"
          fi
          test -n "$user" -a -n "$token"
          printf '%s' "$token" | docker login docker.io --username "$user" --password-stdin

      - name: Stagger Docker task-image pulls
        run: |
          set -euo pipefail
          delay=$(( (ORDINAL - 1) * 15 ))
          echo "Waiting ${delay}s before the task image pull"
          sleep "$delay"

      - name: Install exact Mini-SWE and GT runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e '.[retrieval]' \
            "mini-swe-agent==2.2.8" "harbor==0.20.0" \
            "pytest==9.1.1" "pytest-asyncio==1.4.0"

      - name: Provision pinned local dense backend
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971  $model_dir/model.onnx" | sha256sum -c -
          echo "91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854  $model_dir/tokenizer.json" | sha256sum -c -
          echo "GT_TEST_SNOWFLAKE_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"
          echo "GT_DENSE_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - name: Run this task through Harbor Mini-SWE central GT
        run: |
          set -euo pipefail
          TREATMENT_CONTRACT="$RUNNER_TEMP/gt-treatment-runtime.json"
          harbor dataset download terminal-bench@2.0 -o tb2-budget --export
          EXECUTION_BUDGET=$(python - <<'PY'
          import os
          from pathlib import Path
          from scripts.resolve_harbor_budget import resolve_budget
          task = os.environ["TASK"]
          receipt = resolve_budget(Path("tb2-budget/terminal-bench") / task / "task.toml", multiplier=1.0)
          # Keep Harbor's outer budget unchanged while reserving teardown time
          # for the durable GT receipt and final artifact flush.
          print(max(30.0, float(receipt["execution_budget_sec"]) - 60.0))
          PY
          )
          python -m scripts.render_treatment_agent_args \
            --release-manifest eval/release/active_release.json \
            --source-sha "$(git rev-parse HEAD)" \
            --max-steps 100 \
            --output "$TREATMENT_CONTRACT"
          mapfile -t FEATURE_ARGS < <(
            python -m scripts.render_treatment_agent_args \
              --emit-harbor-args "$TREATMENT_CONTRACT"
          )
          FEATURE_ARGS+=(
            --ak temperature="$TEMPERATURE"
            --ak execution_budget_sec="$EXECUTION_BUDGET"
            --ak preemptive_retrieval_model_dir="$GT_DENSE_MODEL_DIR"
            --ak enable_replay_capture=true
            --ak treatment_runtime_contract_path="$TREATMENT_CONTRACT"
          )
          args=(run
            -d terminal-bench@2.0
            --agent-import-path eval.gt_central_agent:MiniSweCentralAgent
            -m "$MODEL"
            -o results/terminal-bench
            --job-name "${JOB_PREFIX}-task-${ORDINAL}-${GITHUB_RUN_ID}"
            --agent-timeout-multiplier 1.0
            -n 1
            -l 1
            --delete
            -y
            "${FEATURE_ARGS[@]}")
          args+=( -i "$TASK" )
          harbor "${args[@]}"

      - name: Upload task results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-ox-alpha-task-${{ matrix.ordinal }}-${{ github.run_id }}
          path: results/terminal-bench/
          if-no-files-found: warn

  merge:
    if: always()
    needs: [plan, task]
    runs-on: ubuntu-latest
    env:
      EXPECTED_TASK_COUNT: ${{ needs.plan.outputs.task_count }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tb2-miniswe-ox-alpha-task-*-${{ github.run_id }}
          path: task-artifacts
          merge-multiple: true

      - name: Summarize all task receipts
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = []
          for path in Path("task-artifacts").rglob("result.json"):
              try:
                  row = json.loads(path.read_text(encoding="utf-8"))
                  # Each task also uploads Harbor's job-level result.json.
                  # Only trial rows have both task_name and trial_name.
                  if row.get("task_name") and row.get("trial_name"):
                      rows.append(row)
              except Exception as exc:
                  rows.append({"task_name": str(path), "parse_error": str(exc)})
          def reward(row):
              verifier = row.get("verifier_result") or {}
              rewards = verifier.get("rewards") if isinstance(verifier, dict) else {}
              value = rewards.get("reward") if isinstance(rewards, dict) else None
              return value
          reward_values = [reward(row) for row in rows]
          summary = {
              "expected_tasks": int(os.environ.get("EXPECTED_TASK_COUNT", "20")),
              "observed_trial_results": len(rows),
              "rewards": sum(value is not None for value in reward_values),
              "errors": sum(1 for row in rows if row.get("exception_info")),
              "solved": sum(float(value or 0) > 0 for value in reward_values),
              "reward_values": sorted(set(repr(value) for value in reward_values)),
              "task_names": sorted(str(row.get("task_name") or "") for row in rows),
          }
          if summary["observed_trial_results"] != summary["expected_tasks"] or len(set(summary["task_names"])) != summary["expected_tasks"]:
              raise SystemExit(
                  f"expected {summary['expected_tasks']} unique trial result rows, found "
                  f"{summary['observed_trial_results']} rows/{len(set(summary['task_names']))} tasks"
              )
          Path("tb2-ox-alpha-summary.json").write_text(json.dumps(summary, indent=2) + "\n")
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload merged diagnostic summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-ox-alpha-merged-${{ github.run_id }}
          path: tb2-ox-alpha-summary.json
          if-no-files-found: warn
