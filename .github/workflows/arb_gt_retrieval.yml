name: GroundTruth Agent Retrieval Bench (GitHub)

on:
  workflow_dispatch:
    inputs:
      release:
        description: ARB release to evaluate (all or one v2_* release)
        required: true
        default: all
        type: choice
        options:
          - all
          - v2_code2test
          - v2_comment2context
          - v2_trace2code
          - v2_edit2ripple
          - v2_abstention
      harness_ref:
        description: Exact harness/GT branch or commit to evaluate
        required: true
        default: inline-engine
        type: string
      shard_count:
        description: Number of independent exact-snapshot GT shards
        required: true
        default: "20"
        type: choice
        options:
          - "8"
          - "16"
          - "20"
          - "32"
      diagnostic_sample_limit:
        description: Diagnostic-only row cap; 0 runs the complete selected release
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "5"
          - "10"
          - "20"
      run_baselines:
        description: Run official lexical/BM25 all-files baselines on GitHub
        required: true
        default: false
        type: boolean
      run_gt:
        description: Run the production GT retrieval shards
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  ARB_COMMIT: 07014c986f3deadb1548c62b32c0ffbe6a81465d
  ARB_RELEASE_TAG: arb-v2-pinned-07014c9
  SNOWFLAKE_MODEL_REVISION: 7802add0519e4bf94c46ef23552176697c7a1ac7
  SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
  # Codespace benchmark: bounded ONNX parallelism avoids oversubscription on
  # 32-GB runners while keeping the receipt-recorded backend deterministic.
  GT_DENSE_INTRA_OP_THREADS: "4"
  GT_DENSE_INTER_OP_THREADS: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      shard_count: ${{ steps.meta.outputs.shard_count }}
      shards: ${{ steps.meta.outputs.shards }}
      sample_rows: ${{ steps.meta.outputs.sample_rows }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.harness_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install harness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Set up Go for the checked-out GT index source
        if: ${{ inputs.run_gt == true }}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build and verify the checked-out GT index source once
        if: ${{ inputs.run_gt == true }}
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          gofmt -w internal/parser/benchmark_structured.go \
            internal/parser/parser.go internal/parser/structured.go \
            internal/parser/structured_test.go internal/specs/benchmark_structured.go
          git diff --exit-code -- internal/parser internal/specs
          go test -tags sqlite_fts5 ./internal/parser ./internal/specs
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"

      - name: Upload certified GT index for shards
        if: ${{ inputs.run_gt == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-gt-index-${{ github.run_id }}
          path: ${{ runner.temp }}/gt-index
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Verify pinned gold-free inputs (no HF/API access)
        run: |
          mkdir -p "$RUNNER_TEMP/arb-redacted"
          cp benchmarks/arb/redacted/*.jsonl "$RUNNER_TEMP/arb-redacted/"
          cp benchmarks/arb/manifest.json "$RUNNER_TEMP/arb-redacted/"
          python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "arb-redacted"
          manifest = json.loads((root / "manifest.json").read_text())
          release = "${{ inputs.release }}"
          selected = manifest["files"] if release == "all" else [
              item for item in manifest["files"]
              if item["file"] == f"{release}.redacted.jsonl"
          ]
          if not selected:
              raise SystemExit(f"unknown ARB release: {release}")
          for item in selected:
              path = root / item["file"]
              if hashlib.sha256(path.read_bytes()).hexdigest() != item["sha256"]:
                  raise SystemExit(f"redacted checksum mismatch: {path}")
          expected_rows = sum(int(item["rows"]) for item in selected)
          if release == "all" and expected_rows != 427:
              raise SystemExit("unexpected complete redacted row count")
          rows_by_release = [
              [line for line in (root / item["file"]).read_text(encoding="utf-8").splitlines() if line]
              for item in selected
          ]
          sample_limit = int("${{ inputs.diagnostic_sample_limit }}")
          combined = []
          if sample_limit > 0:
              # Stable round-robin coverage across workflow subsets. This is
              # explicitly diagnostic and never labeled a complete ARB run.
              offset = 0
              while len(combined) < sample_limit:
                  added = False
                  for release_rows in rows_by_release:
                      if offset < len(release_rows) and len(combined) < sample_limit:
                          combined.append(release_rows[offset])
                          added = True
                  if not added:
                      break
                  offset += 1
              expected_rows = len(combined)
          else:
              combined = [line for release_rows in rows_by_release for line in release_rows]
          pathlib.Path(root / "selected.json").write_text(
              json.dumps({
                  "release": release,
                  "files": selected,
                  "rows": expected_rows,
                  "diagnostic_sample_limit": sample_limit,
                  "complete_release": sample_limit == 0,
              }, indent=2) + "\n"
          )
          pathlib.Path(root / "all.redacted.jsonl").write_text(
              "\n".join(combined) + "\n",
              encoding="utf-8",
          )
          PY
          (cd "$RUNNER_TEMP/arb-redacted" && sha256sum *.jsonl > SHA256SUMS)

      - name: Record immutable run metadata
        id: meta
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          payload = {
              "schema": "gt.arb.github_run.v1",
              "harness_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "arb_commit": os.environ["ARB_COMMIT"],
              "release": "${{ inputs.release }}",
              "shard_count": int("${{ inputs.shard_count }}"),
              "sample_rows": json.loads((root / "arb-redacted" / "selected.json").read_text())["rows"],
              "diagnostic_sample_limit": int("${{ inputs.diagnostic_sample_limit }}"),
              "complete_release": int("${{ inputs.diagnostic_sample_limit }}") == 0,
              "gold_isolation": True,
              "execution_location": "github-actions",
              "local_benchmark_execution": False,
          }
          (root / "arb-redacted" / "run_manifest.json").write_text(json.dumps(payload, indent=2) + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"release=${{ inputs.release }}", file=output)
              print(f"shard_count=${{ inputs.shard_count }}", file=output)
              print(f"sample_rows={payload['sample_rows']}", file=output)
              print(f"shards={json.dumps(list(range(payload['shard_count'])))}", file=output)
          PY

      - name: Provision pinned Snowflake ONNX model once
        if: ${{ inputs.run_gt == true }}
        run: |
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          base="https://huggingface.co/Snowflake/snowflake-arctic-embed-m/resolve/$SNOWFLAKE_MODEL_REVISION"
          curl --fail --location --retry 4 --retry-all-errors \
            "$base/onnx/model.onnx?download=true" --output "$model_dir/model.onnx"
          curl --fail --location --retry 4 --retry-all-errors \
            "$base/tokenizer.json?download=true" --output "$model_dir/tokenizer.json"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          MODEL_DIR="$model_dir" python - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["MODEL_DIR"])
          tokenizer_sha = hashlib.sha256((root / "tokenizer.json").read_bytes()).hexdigest()
          payload = {
              "schema": "gt.snowflake_onnx_asset.v1",
              "model": "Snowflake/snowflake-arctic-embed-m",
              "revision": os.environ["SNOWFLAKE_MODEL_REVISION"],
              "model_sha256": os.environ["SNOWFLAKE_MODEL_SHA256"],
              "tokenizer_sha256": tokenizer_sha,
              "download_surface": "immutable_direct_asset",
              "inference_api": False,
          }
          (root / "manifest.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY

      - name: Upload pinned Snowflake ONNX asset for shards
        if: ${{ inputs.run_gt == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-snowflake-onnx-${{ github.run_id }}
          path: ${{ runner.temp }}/snowflake-arctic-embed-m
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

      - name: Upload redacted inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-redacted
          if-no-files-found: error
          retention-days: 14

  gt:
    if: ${{ inputs.run_gt == true }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.shards) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.harness_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install harness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,retrieval]'

      - name: Install pinned GroundTruth runtime
        run: python -m pip install --no-deps vendor/groundtruth_mcp-1.0.0-py3-none-any.whl

      - name: Download certified GT index
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arb-gt-index-${{ github.run_id }}
          path: ${{ runner.temp }}/gt-index-bin

      - name: Configure certified GT index binary
        run: |
          chmod +x "$RUNNER_TEMP/gt-index-bin/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index-bin/gt-index" >> "$GITHUB_ENV"

      - name: Download gold-free inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arb-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-redacted

      - name: Download pinned Snowflake ONNX asset
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arb-snowflake-onnx-${{ github.run_id }}
          path: ${{ runner.temp }}/snowflake-arctic-embed-m

      - name: Verify pinned Snowflake ONNX asset
        run: |
          echo "$SNOWFLAKE_MODEL_SHA256  $RUNNER_TEMP/snowflake-arctic-embed-m/model.onnx" \
            | sha256sum -c -

      - name: Verify input checksums and run production GT retrieval
        run: |
          (cd "$RUNNER_TEMP/arb-redacted" && sha256sum -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/arb-cache" "$RUNNER_TEMP/arb-work" "$RUNNER_TEMP/arb-state" "$RUNNER_TEMP/arb-results"
          python scripts/arb_checkout_runner.py \
            --samples "$RUNNER_TEMP/arb-redacted/all.redacted.jsonl" \
            --cache-dir "$RUNNER_TEMP/arb-cache" \
            --work-dir "$RUNNER_TEMP/arb-work" \
            --state-dir "$RUNNER_TEMP/arb-state" \
            --output-dir "$RUNNER_TEMP/arb-results" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ needs.prepare.outputs.shard_count }}" \
            --dense-model-dir "$RUNNER_TEMP/snowflake-arctic-embed-m" \
            --require-dense
          find "$RUNNER_TEMP/arb-results" -type f ! -name 'shard-*.jsonl' -print0 \
            | sort -z | xargs -0 cat > "$RUNNER_TEMP/arb-shard-${{ matrix.shard }}.jsonl"

      - name: Upload GT retrieval shard
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-gt-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/arb-results
            ${{ runner.temp }}/arb-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: warn
          retention-days: 30

      - name: Publish shard progress summary
        if: ${{ always() }}
        run: |
          rows=0
          if [ -f "$RUNNER_TEMP/arb-shard-${{ matrix.shard }}.jsonl" ]; then
            rows=$(wc -l < "$RUNNER_TEMP/arb-shard-${{ matrix.shard }}.jsonl")
          fi
          {
            echo "## GT shard ${{ matrix.shard }}"
            echo "- rows emitted: $rows"
            echo "- job status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  aggregate:
    if: ${{ always() && needs.gt.result != 'skipped' }}
    needs: [prepare, gt, official-baselines]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.harness_ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Download GT shard artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: arb-gt-shard-${{ github.run_id }}-*
          path: ${{ runner.temp }}/arb-gt
          merge-multiple: true
      - name: Download immutable gold-free sample manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arb-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-redacted
      - name: Aggregate GT retrieval and diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/arb-baselines"
          python scripts/arb_aggregate.py \
            --root "$RUNNER_TEMP/arb-gt" \
            --expected-rows "${{ needs.prepare.outputs.sample_rows }}" \
            --expected-samples "$RUNNER_TEMP/arb-redacted/all.redacted.jsonl" \
            --allow-incomplete \
            --output "$RUNNER_TEMP/arb-aggregate.json"
      - name: Install pinned ARB evaluator and release data
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/eyuansu62/agent-retrieval-bench.git@${ARB_COMMIT}"
          python -m pip install zstandard
          mkdir -p "$RUNNER_TEMP/arb-releases" "$RUNNER_TEMP/arb-data"
          gh release download "$ARB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'agent_retrieval_bench_*.tar.zst' \
            --pattern 'agent_retrieval_bench_*.tar.zst.sha256' \
            --dir "$RUNNER_TEMP/arb-releases"
          for archive in "$RUNNER_TEMP/arb-releases"/*.tar.zst; do
            python scripts/arb_extract.py "$archive" "$RUNNER_TEMP/arb-data" \
              --sha256 "$archive.sha256"
          done
          mkdir -p "$RUNNER_TEMP/arb-data/data"
          ln -sfn "$RUNNER_TEMP/arb-data/corpus" "$RUNNER_TEMP/arb-data/data/corpus"
          ln -sfn "$RUNNER_TEMP/arb-data/benchmark" "$RUNNER_TEMP/arb-data/data/benchmark"
          ln -sfn "$RUNNER_TEMP/arb-data/reports" "$RUNNER_TEMP/arb-data/data/reports"
          arb merge-corpus-manifests --local-dir "$RUNNER_TEMP/arb-data"
      - name: Evaluate ranked GT receipts with official ARB metrics
        run: |
          arb_source=$(python -c 'import pathlib,agent_retrieval_bench; print(pathlib.Path(agent_retrieval_bench.__file__).resolve().parent.parent)')
          python scripts/arb_evaluate.py \
            --arb-source "$arb_source" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_code2test/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_comment2context/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_trace2code/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_edit2ripple/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_abstention/samples.jsonl" \
            --predictions-root "$RUNNER_TEMP/arb-gt" \
            --view ranked \
            --corpus-manifest "$RUNNER_TEMP/arb-data/corpus/v2_selective_mixed/corpus_manifest.jsonl" \
            --output "$RUNNER_TEMP/arb-gt-ranked-evaluation.json" \
            --details-output "$RUNNER_TEMP/arb-gt-ranked-details.jsonl" \
            --selective-details-output "$RUNNER_TEMP/arb-gt-ranked-selective-details.jsonl" \
            --allow-incomplete
      - name: Evaluate delivered GT evidence with official ARB metrics
        run: |
          arb_source=$(python -c 'import pathlib,agent_retrieval_bench; print(pathlib.Path(agent_retrieval_bench.__file__).resolve().parent.parent)')
          python scripts/arb_evaluate.py \
            --arb-source "$arb_source" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_code2test/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_comment2context/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_trace2code/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_edit2ripple/samples.jsonl" \
            --samples "$RUNNER_TEMP/arb-data/benchmark/v2_abstention/samples.jsonl" \
            --predictions-root "$RUNNER_TEMP/arb-gt" \
            --view delivered \
            --corpus-manifest "$RUNNER_TEMP/arb-data/corpus/v2_selective_mixed/corpus_manifest.jsonl" \
            --output "$RUNNER_TEMP/arb-gt-delivered-evaluation.json" \
            --details-output "$RUNNER_TEMP/arb-gt-delivered-details.jsonl" \
            --selective-details-output "$RUNNER_TEMP/arb-gt-delivered-selective-details.jsonl" \
            --allow-incomplete
      - name: Download official baselines when present
        if: ${{ inputs.run_baselines == true }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arb-official-baselines-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-baselines
      - name: Upload complete ARB report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-complete-report-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/arb-aggregate.json
            ${{ runner.temp }}/arb-gt-ranked-evaluation.json
            ${{ runner.temp }}/arb-gt-ranked-details.jsonl
            ${{ runner.temp }}/arb-gt-ranked-selective-details.jsonl
            ${{ runner.temp }}/arb-gt-ranked-evaluation.selective.json
            ${{ runner.temp }}/arb-gt-ranked-evaluation.selective.md
            ${{ runner.temp }}/arb-gt-delivered-evaluation.json
            ${{ runner.temp }}/arb-gt-delivered-details.jsonl
            ${{ runner.temp }}/arb-gt-delivered-selective-details.jsonl
            ${{ runner.temp }}/arb-gt-delivered-evaluation.selective.json
            ${{ runner.temp }}/arb-gt-delivered-evaluation.selective.md
            ${{ runner.temp }}/arb-baselines
          if-no-files-found: error
          retention-days: 90

  official-baselines:
    if: inputs.run_baselines == true
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.harness_ref }}
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned ARB evaluator (no HF/API access)
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/eyuansu62/agent-retrieval-bench.git@${ARB_COMMIT}"
          python -m pip install zstandard
      - name: Download pinned GitHub release assets
        run: |
          mkdir -p "$RUNNER_TEMP/arb-releases" "$RUNNER_TEMP/arb-data"
          gh release download "$ARB_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'agent_retrieval_bench_*.tar.zst' \
            --pattern 'agent_retrieval_bench_*.tar.zst.sha256' \
            --dir "$RUNNER_TEMP/arb-releases"
          for archive in "$RUNNER_TEMP/arb-releases"/*.tar.zst; do
            release=$(basename "$archive" | sed -E 's/^agent_retrieval_bench_(.*)\.tar\.zst$/\1/')
            python scripts/arb_extract.py "$archive" "$RUNNER_TEMP/arb-data" \
              --sha256 "$archive.sha256"
            echo "extracted $release"
          # ARB manifests store chunk paths relative to the dataset root
          # (data/corpus/...).  The archives unpack corpus/ at the temp root;
          # expose the canonical data/corpus path before invoking the official
          # evaluator so its baseline is not a silent zero-corpus run.
          mkdir -p "$RUNNER_TEMP/arb-data/data"
          ln -sfn "$RUNNER_TEMP/arb-data/corpus" "$RUNNER_TEMP/arb-data/data/corpus"
          ln -sfn "$RUNNER_TEMP/arb-data/benchmark" "$RUNNER_TEMP/arb-data/data/benchmark"
          ln -sfn "$RUNNER_TEMP/arb-data/reports" "$RUNNER_TEMP/arb-data/data/reports"
      - name: Run official all-files lexical baselines on GitHub
        run: |
          mkdir -p "$RUNNER_TEMP/arb-baselines"
          releases="${{ inputs.release }}"
          if [ "$releases" = "all" ]; then
            releases="v2_code2test v2_comment2context v2_trace2code v2_edit2ripple v2_abstention"
          fi
          for release in $releases; do
            (cd "$RUNNER_TEMP/arb-data" && arb eval-baseline \
              --derived "benchmark/$release" \
              --corpus "corpus/$release" \
              --ranker lexical --candidate-filter all_files --no-keep-list \
              --out "$RUNNER_TEMP/arb-baselines/${release}.summary.json" \
              --details "$RUNNER_TEMP/arb-baselines/${release}.details.jsonl")
          done
      - name: Upload official baseline artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-official-baselines-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-baselines
          if-no-files-found: error
          retention-days: 30
