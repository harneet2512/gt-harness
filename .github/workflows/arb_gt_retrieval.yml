name: GroundTruth Agent Retrieval Bench (GitHub)

on:
  workflow_dispatch:
    inputs:
      release:
        description: ARB release to evaluate (all or one v2_* release)
        required: true
        default: all
        type: choice
        options:
          - all
          - v2_code2test
          - v2_comment2context
          - v2_trace2code
          - v2_edit2ripple
          - v2_abstention
      shard_count:
        description: Number of independent exact-snapshot GT shards (fixed matrix)
        required: true
        default: "8"
        type: choice
        options:
          - "8"
      run_baselines:
        description: Run official lexical/BM25 all-files baselines on GitHub
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  ARB_COMMIT: 07014c986f3deadb1548c62b32c0ffbe6a81465d

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.meta.outputs.release }}
      shard_count: ${{ steps.meta.outputs.shard_count }}
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install harness and pinned ARB
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install "git+https://github.com/eyuansu62/agent-retrieval-bench.git@${ARB_COMMIT}"
          python -m pip install "huggingface_hub[cli]"

      - name: Download and verify official ARB releases
        run: |
          mkdir -p "$RUNNER_TEMP/arb-data"
          if [ "${{ inputs.release }}" = "all" ]; then
            arb download-benchmark --all --local-dir "$RUNNER_TEMP/arb-data"
          else
            arb download-benchmark --version "${{ inputs.release }}" --local-dir "$RUNNER_TEMP/arb-data"
          fi

      - name: Build gold-free redacted inputs
        run: |
          mkdir -p "$RUNNER_TEMP/arb-redacted"
          if [ "${{ inputs.release }}" = "all" ]; then
            python scripts/prepare_arb_redacted_inputs.py \
              --data-dir "$RUNNER_TEMP/arb-data" \
              --out-dir "$RUNNER_TEMP/arb-redacted"
          else
            python scripts/prepare_arb_redacted_inputs.py \
              --data-dir "$RUNNER_TEMP/arb-data" \
              --out-dir "$RUNNER_TEMP/arb-redacted" \
              --release "${{ inputs.release }}"
          fi
          cat "$RUNNER_TEMP/arb-redacted"/*.redacted.jsonl > "$RUNNER_TEMP/arb-redacted/all.redacted.jsonl"
          (cd "$RUNNER_TEMP/arb-redacted" && sha256sum *.jsonl > SHA256SUMS)

      - name: Record immutable run metadata
        id: meta
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          payload = {
              "schema": "gt.arb.github_run.v1",
              "harness_commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "arb_commit": os.environ["ARB_COMMIT"],
              "release": "${{ inputs.release }}",
              "shard_count": int("${{ inputs.shard_count }}"),
              "gold_isolation": True,
              "execution_location": "github-actions",
              "local_benchmark_execution": False,
          }
          (root / "arb-redacted" / "run_manifest.json").write_text(json.dumps(payload, indent=2) + "\n")
          PY
          echo "release=${{ inputs.release }}" >> "$GITHUB_OUTPUT"
          echo "shard_count=${{ inputs.shard_count }}" >> "$GITHUB_OUTPUT"

      - name: Upload redacted inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-redacted
          if-no-files-found: error
          retention-days: 14

  gt:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install harness dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download gold-free inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: arb-redacted-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-redacted

      - name: Verify input checksums and run production GT retrieval
        run: |
          (cd "$RUNNER_TEMP/arb-redacted" && sha256sum -c SHA256SUMS)
          mkdir -p "$RUNNER_TEMP/arb-cache" "$RUNNER_TEMP/arb-work" "$RUNNER_TEMP/arb-state" "$RUNNER_TEMP/arb-results"
          python scripts/arb_checkout_runner.py \
            --samples "$RUNNER_TEMP/arb-redacted/all.redacted.jsonl" \
            --cache-dir "$RUNNER_TEMP/arb-cache" \
            --work-dir "$RUNNER_TEMP/arb-work" \
            --state-dir "$RUNNER_TEMP/arb-state" \
            --output-dir "$RUNNER_TEMP/arb-results" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ needs.prepare.outputs.shard_count }}"
          find "$RUNNER_TEMP/arb-results" -type f ! -name 'shard-*.jsonl' -print0 \
            | sort -z | xargs -0 cat > "$RUNNER_TEMP/arb-shard-${{ matrix.shard }}.jsonl"

      - name: Upload GT retrieval shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-gt-shard-${{ github.run_id }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/arb-results
            ${{ runner.temp }}/arb-shard-${{ matrix.shard }}.jsonl
          if-no-files-found: error
          retention-days: 30

  official-baselines:
    if: inputs.run_baselines == true
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned ARB
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/eyuansu62/agent-retrieval-bench.git@${ARB_COMMIT}"
          python -m pip install "huggingface_hub[cli]"
      - name: Download official benchmark releases
        run: |
          mkdir -p "$RUNNER_TEMP/arb-data"
          if [ "${{ inputs.release }}" = "all" ]; then
            arb download-benchmark --all --local-dir "$RUNNER_TEMP/arb-data"
          else
            arb download-benchmark --version "${{ inputs.release }}" --local-dir "$RUNNER_TEMP/arb-data"
          fi
      - name: Run official all-files lexical baselines on GitHub
        run: |
          mkdir -p "$RUNNER_TEMP/arb-baselines"
          releases="${{ inputs.release }}"
          if [ "$releases" = "all" ]; then
            releases="v2_code2test v2_comment2context v2_trace2code v2_edit2ripple v2_abstention"
          fi
          for release in $releases; do
            arb eval-baseline \
              --derived "$RUNNER_TEMP/arb-data/data/benchmark/$release" \
              --corpus "$RUNNER_TEMP/arb-data/data/corpus/$release" \
              --ranker lexical --candidate-filter all_files --no-keep-list \
              --out "$RUNNER_TEMP/arb-baselines/${release}.summary.json" \
              --details "$RUNNER_TEMP/arb-baselines/${release}.details.jsonl"
          done
      - name: Upload official baseline artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arb-official-baselines-${{ github.run_id }}
          path: ${{ runner.temp }}/arb-baselines
          if-no-files-found: error
          retention-days: 30
