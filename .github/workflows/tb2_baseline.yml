# Terminal-Bench 2.0 BASELINE: stock nano-harness (no GroundTruth) via Harbor.
#
# Validated against harbor==0.20.0 (flags -d/-a/-m/-l/-n/-o/--job-name/
# --agent-timeout-multiplier/-y/-i all confirmed via `harbor run --help` and a
# `--print-config` dry run with the exact invocation below).
#
# A GT-arm workflow will follow later (blocked on container plumbing in
# eval/tb_agent.py install(); see the TODO(gt) there). Keep this file
# baseline-only: when the GT arm lands it gets its own workflow (or a
# gt_enabled input) so the frozen baseline stays reproducible.
name: TB2 baseline (nano, no GT)

on:
  workflow_dispatch:
    inputs:
      api_key:
        description: "Provider API key, supplied from outside at dispatch time (overrides the repo secret)."
        required: false
        default: ""
      model:
        description: "Model id passed to harbor -m AND through to nano. When base_url is set this string is used verbatim as the gateway's model id, so it must be the gateway's NATIVE spelling (api.deepseek.com wants bare 'deepseek-v4-flash', not OpenRouter's 'deepseek/deepseek-v4-flash'). Only with no base_url is a provider/ prefix stripped."
        type: string
        default: "openrouter/stealth/ox-alpha"
      base_url:
        description: "OpenAI-compatible gateway URL; when set, exported as OPENAI_BASE_URL (overrides the repo secret)"
        type: string
        default: ""
      n_tasks:
        description: "Slice size (harbor -l). 'all' = full 89-task dataset"
        type: string
        default: "5"
      concurrency:
        description: "Concurrent trials (harbor -n)"
        type: string
        default: "4"
      job_name:
        description: "Harbor job name (default: auto tb2-baseline-<run id>)"
        type: string
        default: ""
      task_ids:
        description: "Optional comma-separated task names (harbor -i, glob ok). Overrides n_tasks — use to shard a full run manually"
        type: string
        default: ""
      agent_timeout_multiplier:
        description: "LEAVE EMPTY for a leaderboard-legal run. The TB2.1 leaderboard's static_analysis.py requires agent_timeout_multiplier to be null; any value here disqualifies the run AND doubles worst-case wall clock."
        type: string
        default: ""
      n_attempts:
        description: "Trials per task (harbor -k). Leaderboard submission requires >=5 (MIN_TRIALS_PER_TASK). 1 is fine for an internal paired baseline."
        type: string
        default: "1"

jobs:
  baseline:
    runs-on: ubuntu-latest
    # A full 89-task run at -n 4 may not fit even this window; shard it with
    # task_ids across several dispatches if it times out (see workflows README).
    timeout-minutes: 350
    env:
      # Set whichever your model needs: `gh secret set ANTHROPIC_API_KEY` etc.
      # Unset secrets resolve to "" and are simply absent for the agent.
      ANTHROPIC_API_KEY: ${{ inputs.api_key || secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ inputs.api_key || secrets.OPENAI_API_KEY }}
      # Input beats secret; empty means "no gateway" (direct provider APIs).
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ubuntu runners ship ~20-25 GB free on /. TB2 task images are mostly
      # sub-GB but there are 89 distinct ones and harbor keeps pulled images
      # around, so a full run plausibly exhausts the disk. Reclaim the big
      # preinstalled toolchains (~25-30 GB) only for full runs; slices don't
      # need it and this step costs a couple of minutes.
      - name: Free disk space (full runs only)
        if: ${{ inputs.n_tasks == 'all' && inputs.task_ids == '' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          pip install -e . "harbor==0.20.0"

      # A secret set from a PowerShell-written file carries a UTF-8 BOM. The key
      # only ever appears in the `Authorization: Bearer <key>` header, which
      # httpx encodes as ASCII, so a BOM raises
      #   UnicodeEncodeError: 'ascii' codec can't encode character U+FEFF (a BOM)
      # on every single request - i.e. a total run failure that looks like a
      # model problem. Strip it here (and re-mask, since the cleaned string is
      # not the registered secret and would otherwise print unmasked in a PUBLIC
      # repo's logs). Fix at source too: `gh secret set` from clean UTF-8.
      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned, notes = [], []
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if clean != raw:
                  notes.append(f"{name}: removed {len(raw) - len(clean)} stray "
                               "char(s) (BOM/whitespace); re-set the secret to fix at source")
              if not clean.isascii():
                  print(f"::error::{name} still holds non-ASCII characters after "
                        "stripping BOM/whitespace - it cannot be sent as an HTTP header")
                  sys.exit(1)
              cleaned.append((name, clean))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          for n in notes:
              print(f"::warning::{n}")
          print(f"sanitized {len(cleaned)} key(s); {len(notes)} needed repair")
          EOF

      # One ~1k-token call (<$0.001) through nano's OWN provider routing before
      # harbor pulls a single task image. Catches the failures that otherwise
      # cost a full run and look like "the model is bad": wrong model id, bad
      # key, unreachable gateway, and gateways that reject the exact request
      # shape nano sends (max_completion_tokens, translated tool schemas).
      - name: Preflight provider (fail fast, not 5 dead containers)
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'EOF'
          import os, sys
          from nano.cli import build_provider
          from nano.prompts import SYSTEM_PROMPT
          from nano.tools import TOOLS

          model = os.environ["MODEL"]
          base = os.environ.get("OPENAI_BASE_URL") or ""
          # Mirror eval/tb_agent.py: it passes no --base-url, so nano builds a
          # plain client and the openai SDK picks up OPENAI_BASE_URL from env.
          print(f"model={model!r} OPENAI_BASE_URL={base or '(unset)'}")
          try:
              provider = build_provider(model=model, base_url=None)
              r = provider.step(
                  messages=[{"role": "user", "content": "Reply with the single word: ok"}],
                  tools=TOOLS, system=SYSTEM_PROMPT,
              )
          except Exception as e:
              print(f"::error::preflight failed: {type(e).__name__}: {e}")
              print("The model id, API key, or gateway is wrong - fix it before "
                    "spending a run. No task images were pulled.")
              sys.exit(1)
          print(f"preflight ok: stop_reason={r.stop_reason} usage={r.usage} "
                f"text={(r.text or '')[:80]!r} tool_calls={len(r.tool_calls)}")
          EOF

      - name: Disk before run
        run: df -h /

      - name: Run harbor (Terminal-Bench 2.0)
        id: harbor
        env:
          MODEL: ${{ inputs.model }}
          N_TASKS: ${{ inputs.n_tasks }}
          CONCURRENCY: ${{ inputs.concurrency }}
          JOB_NAME_INPUT: ${{ inputs.job_name }}
          TASK_IDS: ${{ inputs.task_ids }}
          AGENT_TIMEOUT_MULTIPLIER: ${{ inputs.agent_timeout_multiplier }}
          N_ATTEMPTS: ${{ inputs.n_attempts }}
        run: |
          set -uo pipefail
          JOB_NAME="${JOB_NAME_INPUT:-tb2-baseline-${GITHUB_RUN_ID}}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          args=( run
            -d terminal-bench@2.0
            -a eval.tb_agent:NanoAgent
            -m "$MODEL"
            -o results/terminal-bench
            --job-name "$JOB_NAME"
            -n "$CONCURRENCY"
            -k "$N_ATTEMPTS"
            -y
          )
          # Only pass the flag when explicitly asked for. Omitting it leaves the
          # multiplier null, which is what the leaderboard's static analysis
          # requires; passing 1.0 explicitly would also be accepted, but null is
          # the documented default and the safer thing to record in the config.
          if [ -n "$AGENT_TIMEOUT_MULTIPLIER" ]; then
            args+=( --agent-timeout-multiplier "$AGENT_TIMEOUT_MULTIPLIER" )
            echo "::warning::agent_timeout_multiplier=$AGENT_TIMEOUT_MULTIPLIER set - this run is NOT leaderboard-legal"
          fi
          if [ -n "$TASK_IDS" ]; then
            IFS=',' read -ra ids <<< "$TASK_IDS"
            for id in "${ids[@]}"; do
              id="$(echo "$id" | xargs)"   # trim whitespace
              [ -n "$id" ] && args+=( -i "$id" )
            done
          elif [ "$N_TASKS" != "all" ]; then
            args+=( -l "$N_TASKS" )
          fi

          harbor "${args[@]}"

      - name: Disk after run
        if: always()
        run: df -h /

      # Everything harbor wrote: result.json plus per-task dirs with the agent
      # transcript (<task>/agent/nano.txt), verifier output, and config.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-baseline-${{ github.run_id }}
          path: results/terminal-bench/
          if-no-files-found: warn

      - name: Score summary
        if: always()
        env:
          JOB_NAME: ${{ steps.harbor.outputs.job_name }}
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          job = os.environ.get("JOB_NAME", "")
          path = Path("results/terminal-bench") / job / "result.json"
          out = [f"## TB2 baseline: `{job}`", ""]
          if not path.is_file():
              out.append(f"No result.json at `{path}` - harbor did not finish. "
                         "Check the run logs and the uploaded artifact.")
          else:
              r = json.loads(path.read_text(encoding="utf-8"))
              stats = r.get("stats", {})
              out += [
                  f"- total trials: **{r.get('n_total_trials', '?')}**",
                  f"- completed: **{stats.get('n_completed_trials', '?')}**"
                  f", errored: **{stats.get('n_errored_trials', '?')}**",
              ]
              # stats.evals["<agent>__<model>__<dataset>"].reward_stats maps
              # reward name -> {value: [trial names]} (harbor 0.20 schema).
              for key, ev in (stats.get("evals") or {}).items():
                  out.append(f"\n### {key}")
                  for reward, by_val in (ev.get("reward_stats") or {}).items():
                      total = sum(len(v) for v in by_val.values())
                      solved = sum(len(v) for val, v in by_val.items()
                                   if float(val) >= 1)
                      pct = f"{100 * solved / total:.1f}%" if total else "n/a"
                      out.append(f"- **{reward}**: {solved}/{total} ({pct})")
                  for k, v in (ev.get("pass_at_k") or {}).items():
                      out.append(f"- pass@{k}: {v}")
              rows = []
              for t in r.get("trial_results", []):
                  name = t.get("task_name") or t.get("trial_name", "?")
                  vr = t.get("verifier_result") or {}
                  rewards = vr.get("rewards")
                  exc = (t.get("exception_info") or {}).get("exception_type")
                  status = json.dumps(rewards) if rewards else (exc or "no reward")
                  rows.append(f"| {name} | {status} |")
              if rows:
                  out += ["", "| task | rewards |", "|---|---|"] + rows
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          EOF
