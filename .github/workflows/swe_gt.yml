# SWE-bench Verified GT ARM: nano-harness + GroundTruth via Harbor.
#
# Mirrors tb2_gt.yml (the hardened shape: sanitize ALL provider secrets,
# retrying provider preflight with cause chain, gt-index build + FTS5 smoke,
# GT artifact preflight, artifact upload always, score summary) with the
# SWE-bench deltas:
#   1. dataset swebench-verified@1.0 (500 tasks), agent import path
#      eval.swe_agent:GTNanoSweAgent (same GT container plumbing as the TB2
#      arm proven on run 30501483446; --gt-root defaults ON to /testbed —
#      the repo location is baked into the SWE task images).
#   2. free-disk step runs UNCONDITIONALLY: swebench eval images are 1-3 GB
#      EACH (vs mostly sub-GB TB2 images), so even a 5-task slice benefits
#      from the reclaimed ~25-30 GB.
#   3. defaults: n_tasks 5, concurrency 2 (task.toml wants 1 cpu / 4G mem per
#      task; hosted runners have 4 vCPU / 16 GB), no agent-timeout multiplier
#      (task.toml's 3000 s per side is already generous).
#
# Model-id gotcha: the default is the BARE "deepseek-v4-flash". With
# OPENAI_BASE_URL set (the DeepSeek gateway), eval/swe_agent.py passes the
# model string through VERBATIM and DeepSeek rejects the "deepseek/" prefixed
# spelling with a 400 on every request. Use provider/name forms only for
# direct APIs (anthropic/claude-*) or gateways whose ids are prefixed
# (OpenRouter). See .github/workflows/README.md.
#
# GT observability: gt_engine's delivery ledger is written to
# /logs/agent/gt_ledger.jsonl inside each task container (bridge._ledger_path
# prefers /logs/agent, which harbor always mounts), so it lands in the results
# artifact next to nano.txt; GT's /testbed/.gt index dir is self-gitignored
# and removed before the model patch is staged — it can never be graded.
name: SWE GT arm (nano + GroundTruth)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id as the provider/gateway expects it (harbor -m). DeepSeek gateway needs the BARE id (deepseek-v4-flash); a deepseek/ prefix 400s every request"
        type: string
        default: "deepseek-v4-flash"
      base_url:
        description: "OpenAI-compatible gateway URL; when set, exported as OPENAI_BASE_URL (overrides the repo secret)"
        type: string
        default: ""
      n_tasks:
        description: "Slice size (harbor -l). 'all' = full 500-task dataset (will NOT fit one hosted runner — shard with task_ids)"
        type: string
        default: "5"
      concurrency:
        description: "Concurrent trials (harbor -n). Keep <=2 on hosted runners (1 cpu/4G per task)"
        type: string
        default: "2"
      job_name:
        description: "Harbor job name (default: auto swe-gt-<run id>)"
        type: string
        default: ""
      task_ids:
        description: "Optional comma-separated task names (harbor -i, glob ok). Overrides n_tasks — use to shard or pin tasks"
        type: string
        default: ""
      gt_profile:
        description: "GT_RL_PROFILE for the agent (GT capability profile; '2' = production law)"
        type: string
        default: "2"

jobs:
  gt:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Set whichever your model needs: `gh secret set ANTHROPIC_API_KEY` etc.
      # Unset secrets resolve to "" and are simply absent for the agent.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # Input beats secret; empty means "no gateway" (direct provider APIs).
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      # GTNanoSweAgent resolves GT_RL_PROFILE as kwarg > host env > default "2"
      # and forwards every GT_* host var into the task container.
      GT_RL_PROFILE: ${{ inputs.gt_profile }}
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Checkout pinned Groundtruth producer
        uses: actions/checkout@v4
        with:
          repository: harneet2512/groundtruth
          ref: 4967e0080cef47f614b1761a3152b784c0355a30
          path: .gt-index-source

      - name: Set up Go (for gt-index)
        uses: actions/setup-go@v5
        with:
          go-version-file: .gt-index-source/gt-index/go.mod
          cache-dependency-path: .gt-index-source/gt-index/go.sum

      # CGO (mattn/go-sqlite3) + `-tags sqlite_fts5` is MANDATORY: without the
      # tag the FTS tables are silently compiled out and GT's search legs
      # degrade (Groundtruth AGENTS.md §E). gcc ships on ubuntu-latest.
      # Static link first (swebench images are glibc Ubuntu, but static keeps
      # the binary image-agnostic); fall back to dynamic with a warning.
      - name: Build gt-index (linux-amd64, CGO + sqlite_fts5)
        run: |
          set -euo pipefail
          export GT_INDEX_SOURCE_DIR="$GITHUB_WORKSPACE/.gt-index-source/gt-index"
          export GT_INDEX_BINARY_OUTPUT="$RUNNER_TEMP/gt-index-linux-amd64"
          bash scripts/build_external_gt_index.sh
          echo "GT_INDEX_BINARY=$GT_INDEX_BINARY_OUTPUT" >> "$GITHUB_ENV"
          echo "GT_INDEX_BINARY_HOST=$GT_INDEX_BINARY_OUTPUT" >> "$GITHUB_ENV"

      # Prove the binary indexes AND that FTS5 made it in (the failure mode is
      # silent) before spending a single API dollar.
      - name: Smoke gt-index
        run: |
          set -euo pipefail
          "$GT_INDEX_BINARY" -root nano -output /tmp/gt-smoke.db
          python3 - <<'EOF'
          import sqlite3
          names = {r[0] for r in sqlite3.connect("/tmp/gt-smoke.db")
                   .execute("SELECT name FROM sqlite_master")}
          assert {"nodes", "edges"} <= names, f"core tables missing: {names}"
          missing = {"nodes_fts", "symbol_content_fts"} - names
          assert not missing, f"FTS5 tables missing (built without -tags sqlite_fts5?): {missing}"
          meta = dict(sqlite3.connect("/tmp/gt-smoke.db").execute(
              "SELECT key,value FROM project_meta"))
          assert meta.get("graph_resolution_schema_version") == "2"
          assert meta.get("graph_resolution_complete") == "1"
          assert meta.get("graph_completion_schema") == "gt-index.graph-completion.v1"
          print("gt-index smoke ok:", len(names), "tables")
          EOF

      # UNCONDITIONAL (differs from tb2_gt.yml): swebench eval images are
      # 1-3 GB each and harbor keeps pulled images around; ubuntu runners
      # ship only ~20-25 GB free on /. Reclaiming the preinstalled toolchains
      # (~25-30 GB) costs a couple of minutes and pays for itself even on a
      # 5-task slice.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          pip install -e . "harbor==0.20.0"

      # Every dispatch re-imports credentials from secrets, so every
      # credential-shaped secret must be sanitized per run. A BOM-carrying key
      # dies at httpx's ASCII header encode (GHA run 30496848157); a
      # CR/LF-carrying base URL dies as a generic APIConnectionError (runs
      # 30500833711 + 30501029611). Strip + re-mask + re-export ALL of them,
      # keys AND the gateway URL.
      - name: Sanitize provider secrets (BOM / whitespace / CRLF)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned, notes = [], []
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY", "OPENAI_BASE_URL"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if clean != raw:
                  notes.append(f"{name}: removed {len(raw) - len(clean)} stray "
                               "char(s) (BOM/whitespace/CRLF); re-set the secret to fix at source")
              if not clean.isascii():
                  print(f"::error::{name} still holds non-ASCII characters after "
                        "stripping - it cannot be sent in an HTTP request")
                  sys.exit(1)
              cleaned.append((name, clean))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          for n in notes:
              print(f"::warning::{n}")
          print(f"sanitized {len(cleaned)} value(s); {len(notes)} needed repair")
          EOF

      # One ~1k-token call (<$0.001) through nano's OWN provider routing before
      # harbor pulls a single (1-3 GB!) task image. Model-prefix handling
      # mirrors eval/swe_agent.py _model_and_env (strip "provider/" only when
      # no OPENAI_BASE_URL gateway is configured).
      - name: Preflight provider (fail fast, not 5 dead containers)
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'EOF'
          import os, sys
          from nano.cli import build_provider
          from nano.prompts import SYSTEM_PROMPT
          from nano.tools import TOOLS

          model = os.environ["MODEL"]
          base = os.environ.get("OPENAI_BASE_URL") or ""
          if not base:
              model = model.split("/", 1)[-1]
          print(f"model={model!r} OPENAI_BASE_URL={base or '(unset)'}")
          # 3 attempts with backoff: one transient runner->gateway blip must
          # not kill a dispatch (two real dispatches died on a single
          # APIConnectionError). Print the exception CAUSE chain - openai's
          # "Connection error." hides the DNS/SSL/URL detail needed to
          # distinguish a bad secret from a network blip.
          import time
          last = None
          for attempt in range(1, 4):
              try:
                  provider = build_provider(model=model, base_url=None)
                  r = provider.step(
                      messages=[{"role": "user", "content": "Reply with the single word: ok"}],
                      tools=TOOLS, system=SYSTEM_PROMPT,
                  )
                  break
              except Exception as e:
                  last = e
                  chain = []
                  c = e
                  while c is not None and len(chain) < 5:
                      chain.append(f"{type(c).__name__}: {c}")
                      c = c.__cause__ or c.__context__
                  print(f"attempt {attempt}/3 failed: " + " <- ".join(chain))
                  time.sleep(5 * attempt)
          else:
              print(f"::error::preflight failed after 3 attempts: "
                    f"{type(last).__name__}: {last}")
              print("The model id, API key, or gateway is wrong - fix it before "
                    "spending a run. No task images were pulled.")
              sys.exit(1)
          print(f"preflight ok: stop_reason={r.stop_reason} usage={r.usage} "
                f"text={(r.text or '')[:80]!r} tool_calls={len(r.tool_calls)}")
          EOF

      # GTNanoSweAgent fail-fasts in install() when the wheel or binary is
      # missing; surface the same check here, before harbor spends anything.
      - name: Preflight GT artifacts
        run: |
          set -euo pipefail
          ls vendor/groundtruth_mcp-*.whl
          test -x "$GT_INDEX_BINARY_HOST"
          python - <<'EOF'
          from eval.swe_agent import GTNanoSweAgent
          print("wheel:", GTNanoSweAgent._gt_wheel())
          print("binary:", GTNanoSweAgent._gt_binary_host())
          EOF

      - name: Disk before run
        run: df -h /

      - name: Run harbor (SWE-bench Verified)
        id: harbor
        env:
          MODEL: ${{ inputs.model }}
          N_TASKS: ${{ inputs.n_tasks }}
          CONCURRENCY: ${{ inputs.concurrency }}
          JOB_NAME_INPUT: ${{ inputs.job_name }}
          TASK_IDS: ${{ inputs.task_ids }}
        run: |
          set -uo pipefail
          JOB_NAME="${JOB_NAME_INPUT:-swe-gt-${GITHUB_RUN_ID}}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          args=( run
            -d swebench-verified@1.0
            -a eval.swe_agent:GTNanoSweAgent
            -m "$MODEL"
            -o results/swebench
            --job-name "$JOB_NAME"
            -n "$CONCURRENCY"
            -y
          )
          if [ -n "$TASK_IDS" ]; then
            IFS=',' read -ra ids <<< "$TASK_IDS"
            for id in "${ids[@]}"; do
              id="$(echo "$id" | xargs)"   # trim whitespace
              [ -n "$id" ] && args+=( -i "$id" )
            done
          elif [ "$N_TASKS" != "all" ]; then
            args+=( -l "$N_TASKS" )
          fi

          harbor "${args[@]}"

      - name: Disk after run
        if: always()
        run: df -h /

      # Everything harbor wrote: result.json plus per-task dirs with the agent
      # transcript (<task>/agent/nano.txt), the GT delivery ledger
      # (<task>/agent/gt_ledger.jsonl), the staged model patch
      # (<task>/agent/model_patch.diff), verifier output, and config.
      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swe-gt-${{ github.run_id }}
          path: results/swebench/
          if-no-files-found: warn

      - name: Score summary
        if: always()
        env:
          JOB_NAME: ${{ steps.harbor.outputs.job_name }}
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          job = os.environ.get("JOB_NAME", "")
          path = Path("results/swebench") / job / "result.json"
          out = [f"## SWE GT arm: `{job}`", ""]
          if not path.is_file():
              out.append(f"No result.json at `{path}` - harbor did not finish. "
                         "Check the run logs and the uploaded artifact.")
          else:
              r = json.loads(path.read_text(encoding="utf-8"))
              stats = r.get("stats", {})
              out += [
                  f"- total trials: **{r.get('n_total_trials', '?')}**",
                  f"- completed: **{stats.get('n_completed_trials', '?')}**"
                  f", errored: **{stats.get('n_errored_trials', '?')}**",
              ]
              # stats.evals["<agent>__<model>__<dataset>"].reward_stats maps
              # reward name -> {value: [trial names]} (harbor 0.20 schema).
              for key, ev in (stats.get("evals") or {}).items():
                  out.append(f"\n### {key}")
                  for reward, by_val in (ev.get("reward_stats") or {}).items():
                      total = sum(len(v) for v in by_val.values())
                      solved = sum(len(v) for val, v in by_val.items()
                                   if float(val) >= 1)
                      pct = f"{100 * solved / total:.1f}%" if total else "n/a"
                      out.append(f"- **{reward}**: {solved}/{total} ({pct})")
                  for k, v in (ev.get("pass_at_k") or {}).items():
                      out.append(f"- pass@{k}: {v}")
              rows = []
              for t in r.get("trial_results", []):
                  name = t.get("task_name") or t.get("trial_name", "?")
                  vr = t.get("verifier_result") or {}
                  rewards = vr.get("rewards")
                  exc = (t.get("exception_info") or {}).get("exception_type")
                  status = json.dumps(rewards) if rewards else (exc or "no reward")
                  rows.append(f"| {name} | {status} |")
              if rows:
                  out += ["", "| task | rewards |", "|---|---|"] + rows
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(out) + "\n")
          EOF
