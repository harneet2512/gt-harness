# Terminal-Bench 2.0 MINI-SWE BASELINE, sharded across runners (GT-OFF).
#
# Cloned from tb2_baseline_sharded.yml with the harness swapped to
# eval.miniswe_agent:MiniSweAgent (mini-swe-agent==2.2.8 installed in-container
# by uv, runs scripts/miniswe_gt_run.py --gt-off). Fans the 89-task dataset
# across N runners, each running its own harbor job over a disjoint slice, then
# merges the shard results into one score. The plan job enumerates the dataset,
# sorts task names, and cuts contiguous slices - same dataset + same shard count
# always yields the same assignment, so a GT arm can be paired shard-for-shard.
#
# GT-OFF only (no --gt-root, no GT_* env, no groundtruth install). This is an
# internal matched control, NOT a leaderboard submission: --agent-timeout-
# multiplier 1.0 (the frozen comparator config).
name: TB2 miniswe baseline sharded (no GT)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for harbor -m, passed through to miniswe verbatim when base_url is set (api.deepseek.com wants bare 'deepseek-v4-flash')"
        type: string
        default: "deepseek-v4-flash"
      base_url:
        description: "OpenAI-compatible gateway URL; exported as OPENAI_BASE_URL (overrides the repo secret)"
        type: string
        default: ""
      shards:
        description: "Number of runners to fan out across. 89 tasks / shards = tasks per runner"
        type: string
        default: "5"
      concurrency:
        description: "Concurrent trials WITHIN each runner (harbor -n). 4 = one per vCPU"
        type: string
        default: "4"
      include:
        description: "Optional comma-separated task names/globs to restrict the pool before sharding (default: all 89)"
        type: string
        default: ""
      exclude:
        description: "Optional comma-separated task names/globs to drop from the pool before sharding"
        type: string
        default: ""
      dataset:
        description: "Harbor dataset name@version"
        type: string
        default: "terminal-bench@2.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.shard.outputs.matrix }}
      n_tasks: ${{ steps.shard.outputs.n_tasks }}
      tasks_json: ${{ steps.shard.outputs.tasks_json }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GT Harness + Harbor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[miniswe]" "harbor==0.20.0"

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned, notes = [], []
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if clean != raw:
                  notes.append(f"{name}: removed {len(raw) - len(clean)} stray char(s)")
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping "
                        "BOM/whitespace - it cannot be sent as an HTTP header")
                  sys.exit(1)
              cleaned.append((name, clean))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          for n in notes:
              print(f"::warning::{n}")
          EOF

      # Gate the whole fan-out on one ~1k-token call through the runner's exact
      # routing (mirrors scripts/miniswe_gt_run.py: bare model id becomes
      # openai/<id> with api_base=OPENAI_BASE_URL). Calls litellm.completion
      # directly - miniswe's LitellmModel.query also parses tool calls, which
      # can raise FormatError on a valid model response. Records served model id
      # + system_fingerprint (the API exposes no snapshot suffix).
      - name: Preflight provider (gates all shards)
        env:
          MODEL: ${{ inputs.model }}
        run: |
          python - <<'EOF'
          import os, sys
          import litellm

          model = os.environ["MODEL"]
          base = os.environ.get("OPENAI_BASE_URL") or ""
          mname, kwargs = model, {"temperature": 1.0}
          if base and "/" not in model:
              mname = f"openai/{model}"
              kwargs["api_base"] = base
          print(f"model={model!r} -> litellm model={mname!r} "
                f"OPENAI_BASE_URL={base or '(unset)'}")
          try:
              resp = litellm.completion(
                  model=mname,
                  messages=[{"role": "user",
                             "content": "Reply with the single word: ok"}],
                  **kwargs,
              )
          except Exception as e:
              print(f"::error::preflight failed: {type(e).__name__}: {e}")
              print("No runners were spawned and no task images were pulled.")
              sys.exit(1)
          d = resp.model_dump()
          text = (d.get("choices") or [{}])[0].get("message", {}).get("content") or ""
          print(f"preflight ok: served_model={d.get('model')} "
                f"system_fingerprint={d.get('system_fingerprint')} "
                f"usage={d.get('usage')} text={text[:80]!r}")
          EOF

      # Task definitions only (~15s, no Docker, no API): gives us the real task
      # names so shards can be explicit and reproducible.
      - name: Enumerate dataset and build shard matrix
        id: shard
        env:
          DATASET: ${{ inputs.dataset }}
          SHARDS: ${{ inputs.shards }}
          INCLUDE: ${{ inputs.include }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o ds --export
          python - <<'EOF'
          import fnmatch, json, os
          from pathlib import Path

          dataset = os.environ["DATASET"]
          n_shards = max(1, int(os.environ["SHARDS"]))
          root = Path("ds") / dataset.split("@", 1)[0]
          tasks = sorted(p.name for p in root.iterdir() if p.is_dir())
          if not tasks:
              raise SystemExit(f"::error::no tasks found under {root}")

          def patterns(raw):
              return [s.strip() for s in raw.split(",") if s.strip()]

          inc, exc = patterns(os.environ["INCLUDE"]), patterns(os.environ["EXCLUDE"])
          if inc:
              tasks = [t for t in tasks if any(fnmatch.fnmatch(t, p) for p in inc)]
          if exc:
              tasks = [t for t in tasks if not any(fnmatch.fnmatch(t, p) for p in exc)]
          if not tasks:
              raise SystemExit("::error::include/exclude filtered every task out")

          # Contiguous slices over the sorted list: same dataset + same shard
          # count always produces the same assignment, so a GT arm can be paired
          # shard-for-shard against this baseline.
          n_shards = min(n_shards, len(tasks))
          base, extra = divmod(len(tasks), n_shards)
          shards, start = [], 0
          for i in range(n_shards):
              size = base + (1 if i < extra else 0)
              shards.append({"id": i + 1, "tasks": ",".join(tasks[start:start + size])})
              start += size

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(shards)}\n")
              f.write(f"n_tasks={len(tasks)}\n")
              f.write(f"tasks_json={json.dumps(tasks, separators=(',', ':'))}\n")

          summary = [f"## Plan: {len(tasks)} tasks across {n_shards} shard(s)", ""]
          for s in shards:
              names = s["tasks"].split(",")
              summary.append(f"- **shard {s['id']}** ({len(names)}): `{names[0]}` .. `{names[-1]}`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          EOF

  shard:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # One bad shard must not cancel the others - a partial baseline with a
      # known-missing shard is still useful; a cancelled fan-out is not.
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Every shard pulls a dozen-plus distinct task images, so reclaim the big
      # preinstalled toolchains unconditionally here.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - name: Install GT Harness + Harbor
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[miniswe]" "harbor==0.20.0"

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned = []
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping")
                  sys.exit(1)
              cleaned.append((name, clean))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          EOF

      - name: Run harbor shard ${{ matrix.shard.id }}
        id: harbor
        env:
          MODEL: ${{ inputs.model }}
          CONCURRENCY: ${{ inputs.concurrency }}
          DATASET: ${{ inputs.dataset }}
          SHARD_ID: ${{ matrix.shard.id }}
          SHARD_TASKS: ${{ matrix.shard.tasks }}
        run: |
          set -uo pipefail
          JOB_NAME="tb2-miniswe-${GITHUB_RUN_ID}-shard${SHARD_ID}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          args=( run
            -d "$DATASET"
            -a eval.miniswe_agent:MiniSweAgent
            -m "$MODEL"
            -o results/terminal-bench
            --job-name "$JOB_NAME"
            --agent-timeout-multiplier 1.0
            -n "$CONCURRENCY"
            -y
          )
          IFS=',' read -ra ids <<< "$SHARD_TASKS"
          for id in "${ids[@]}"; do
            id="$(echo "$id" | xargs)"
            [ -n "$id" ] && args+=( -i "$id" )
          done
          echo "shard ${SHARD_ID}: ${#ids[@]} tasks at -n ${CONCURRENCY}"
          harbor "${args[@]}"

      - name: Disk after run
        if: always()
        run: df -h /

      - name: Stage readable, complete shard artifacts
        if: always()
        env:
          SHARD_TASKS: ${{ matrix.shard.tasks }}
        run: |
          set -euo pipefail
          if [ ! -d results/terminal-bench ]; then
            echo "::error::Harbor produced no results/terminal-bench directory"
            exit 1
          fi
          sudo chmod -R a+rX results/terminal-bench
          python -m scripts.stage_harbor_artifacts \
            results/terminal-bench staged-results \
            --expected-csv "$SHARD_TASKS"

      - name: Upload shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-${{ github.run_id }}-shard${{ matrix.shard.id }}
          path: staged-results/
          if-no-files-found: error

  merge:
    needs: [plan, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tb2-miniswe-${{ github.run_id }}-shard*
          path: shards
          merge-multiple: false

      # Merge honestly: a shard that never produced a result.json is reported as
      # a missing shard, never silently treated as zero solved tasks.
      - name: Merge shard results
        env:
          EXPECTED_TASKS_JSON: ${{ needs.plan.outputs.tasks_json }}
        run: |
          python -m scripts.harbor_results shards \
            --expected-json "$EXPECTED_TASKS_JSON" \
            --merged merged.json \
            --summary SUMMARY.md

      - name: Upload merged result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-${{ github.run_id }}-MERGED
          path: |
            merged.json
            SUMMARY.md
          if-no-files-found: error
