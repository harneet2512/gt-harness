name: "GT Harness: DeepSWE paid smoke20"

on:
  workflow_dispatch:
    inputs:
      approve_paid_run:
        description: "Explicit approval for authenticated paid provider requests"
        required: false
        type: boolean
        default: false
      cohort_stage:
        description: "Paid cohort stage: gate exactly one task, then the remaining 19"
        required: false
        type: choice
        options: [gate-one, remaining-19]
        default: gate-one
      prior_gate_run_id:
        description: "Required for remaining-19: completed gate-one workflow run ID"
        required: false
        type: string
        default: ""
      readiness_run_id:
        description: "Completed provider-free readiness workflow run ID (reuse; no rerun)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      approve_paid_run:
        description: "Explicit approval for authenticated paid provider requests"
        required: false
        type: boolean
        default: false
      cohort_stage:
        description: "Paid cohort stage: gate exactly one task, then the remaining 19"
        required: false
        type: string
        default: gate-one
      prior_gate_run_id:
        description: "Required for remaining-19: completed gate-one workflow run ID"
        required: false
        type: string
        default: ""
      readiness_run_id:
        description: "Completed provider-free readiness workflow run ID (reuse; no rerun)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: gt-harness-deepswe20-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.cohort.outputs.matrix }}
      source_sha: ${{ steps.source.outputs.sha }}
      task_count: ${{ steps.cohort.outputs.task_count }}
      task_order_sha256: ${{ steps.cohort.outputs.task_order_sha256 }}
      model: ${{ steps.cohort.outputs.model }}
      provider_base_url: ${{ steps.cohort.outputs.provider_base_url }}
      provider_routing_json: ${{ steps.cohort.outputs.provider_routing_json }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Resolve the immutable GT Harness source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Checkout the immutable DeepSWE snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: datacurve-ai/deep-swe
          ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
          path: deepswe-bench

      - name: Validate staged cohort inputs
        if: ${{ inputs.cohort_stage == 'remaining-19' }}
        env:
          COHORT_STAGE: ${{ inputs.cohort_stage }}
          PRIOR_GATE_RUN_ID: ${{ inputs.prior_gate_run_id }}
        run: |
          set -euo pipefail
          python -c 'from scripts.smoke_stage import validate_stage_inputs; import os; validate_stage_inputs(os.environ["COHORT_STAGE"], os.environ["PRIOR_GATE_RUN_ID"])'

      - name: Download and bind the completed gate-one attestation
        if: ${{ inputs.cohort_stage == 'remaining-19' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.prior_gate_run_id }}
          name: gt-harness-deepswe20-attestation-${{ inputs.prior_gate_run_id }}
          path: prior-gate

      - name: Resolve and attest the balanced DeepSWE smoke20 cohort
        id: cohort
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TREATMENT: groundtruth
          APPROVE_PAID_RUN: ${{ inputs.approve_paid_run || 'false' }}
          COHORT_STAGE: ${{ inputs.cohort_stage || 'gate-one' }}
          PRIOR_GATE_RUN_ID: ${{ inputs.prior_gate_run_id || '' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import tomllib
          from pathlib import Path

          from scripts.resolve_harbor_budget import (
              SUPERVISOR_GRACE_SECONDS,
              TASK_CONFIG_IDENTITY,
              resolve_budget,
          )
          from scripts.provider_preflight import load_route
          from scripts.smoke_stage import (
              GATE_STAGE,
              GATE_TASK_ID,
              REMAINDER_STAGE,
              select_stage_tasks,
              stage_timeout_cap_seconds,
              validate_prior_gate,
              validate_stage_inputs,
          )

          manifest_path = Path("eval/deepswe_smoke20_v1.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          bundle = json.loads(
              Path("config/deepswe_product_bundle_v1.json").read_text(encoding="utf-8")
          )
          bundle_tasks = {
              str(row["task_id"]): row for row in bundle.get("tasks", [])
          }
          bench = Path("deepswe-bench")
          if manifest.get("schema") != "gt.deepswe_smoke20.v1":
              raise SystemExit("invalid DeepSWE smoke20 manifest schema")
          if manifest.get("benchmark_sha") != "435ee89ec2f2e2289f33b0da4f992f0b7b7266b9":
              raise SystemExit("DeepSWE manifest revision mismatch")
          if bundle.get("dataset", {}).get("task_config_identity") != TASK_CONFIG_IDENTITY:
              raise SystemExit("DeepSWE task config identity policy mismatch")
          if os.popen("git -C deepswe-bench rev-parse HEAD").read().strip() != manifest["benchmark_sha"]:
              raise SystemExit("checked-out DeepSWE revision mismatch")

          tasks = list(manifest.get("task_ids") or [])
          if len(tasks) != 20 or len(set(tasks)) != 20:
              raise SystemExit("DeepSWE smoke20 must contain 20 unique tasks")
          order_hash = hashlib.sha256(("\n".join(tasks) + "\n").encode()).hexdigest()
          if order_hash != manifest.get("task_order_sha256"):
              raise SystemExit("DeepSWE smoke20 order hash mismatch")

          stage = os.environ["COHORT_STAGE"].strip() or GATE_STAGE
          prior_gate_run_id = os.environ["PRIOR_GATE_RUN_ID"].strip()
          validate_stage_inputs(stage, prior_gate_run_id)
          prior_gate = None
          if stage == REMAINDER_STAGE:
              prior_gate = validate_prior_gate(
                  Path("prior-gate"),
                  source_sha=os.environ["SOURCE_SHA"],
                  prior_gate_run_id=prior_gate_run_id,
              )
          selected_tasks = select_stage_tasks(tasks, stage)

          full_language_counts = {}
          for task in tasks:
              config = bench / "tasks" / task / "task.toml"
              if not config.is_file():
                  raise SystemExit(f"missing DeepSWE task: {task}")
              with config.open("rb") as handle:
                  task_config = tomllib.load(handle)
              language = str((task_config.get("metadata") or {}).get("language") or "unknown")
              full_language_counts[language] = full_language_counts.get(language, 0) + 1
          if full_language_counts != manifest.get("language_counts"):
              raise SystemExit(f"DeepSWE language balance mismatch: {full_language_counts!r}")

          language_counts = {}
          matrix = []
          for ordinal, task in enumerate(selected_tasks, start=1):
              config = bench / "tasks" / task / "task.toml"
              if not config.is_file():
                  raise SystemExit(f"missing DeepSWE task: {task}")
              with config.open("rb") as handle:
                  task_config = tomllib.load(handle)
              language = str((task_config.get("metadata") or {}).get("language") or "unknown")
              language_counts[language] = language_counts.get(language, 0) + 1
              budget = resolve_budget(
                  config,
                  multiplier=1.0,
                  max_timeout_sec=stage_timeout_cap_seconds(stage),
              )
              # Pier applies this multiplier to task.toml's timeout. Keep the
              # outer enforcement identical to the resolved/capped plan.
              budget["timeout_multiplier"] = (
                  float(budget["execution_budget_sec"])
                  / float(budget["base_timeout_sec"])
              )
              bundle_task = bundle_tasks.get(task)
              if bundle_task is None:
                  raise SystemExit(f"task missing from product bundle: {task}")
              if budget["task_config_sha256"] != bundle_task["task_config_sha256"]:
                  raise SystemExit(f"task config digest differs from product bundle: {task}")
              matrix.append(
                  {
                      "ordinal": ordinal,
                      "task": task,
                      "language": language,
                      "outer_agent_timeout_seconds": int(budget["execution_budget_sec"]),
                      "agent_timeout_multiplier": budget["timeout_multiplier"],
                      "time_budget_seconds": max(
                          30,
                          int(float(budget["execution_budget_sec"]) - SUPERVISOR_GRACE_SECONDS),
                      ),
                      "task_config_sha256": budget["task_config_sha256"],
                      "container_image": bundle_task["container_image"],
                      "container_digest": bundle_task["container_digest"],
                  }
              )
          treatment = os.environ["TREATMENT"].strip().lower()
          if treatment != "groundtruth":
              raise SystemExit("paid smoke20 is GT-only; retained HAR-82 data is the baseline")
          provider_route, provider_route_sha256 = load_route(
              Path("config/provider_route.v1.json")
          )

          receipt = {
              "schema": "gt.deepswe_gt_harness_plan.v1",
              "source_sha": os.environ["SOURCE_SHA"],
              "benchmark_sha": manifest["benchmark_sha"],
              "task_config_identity": TASK_CONFIG_IDENTITY,
              "task_ids": selected_tasks,
              "task_count": len(selected_tasks),
              "task_order_sha256": hashlib.sha256(("\n".join(selected_tasks) + "\n").encode()).hexdigest(),
              "cohort_stage": stage,
              "gate_task_id": GATE_TASK_ID,
              "full_task_count": len(tasks),
              "full_task_order_sha256": order_hash,
              "full_language_counts": full_language_counts,
              "prior_gate": prior_gate,
              "language_counts": language_counts,
              "attempts_per_task": 1,
              "max_parallel": min(20, len(selected_tasks)),
              "agent": "eval.pier_gt_harness_adapter:PierGtHarnessMiniSwe246Agent",
              "agent_scaffold": "mini-swe-agent",
              "agent_scaffold_version": "2.4.6",
              "treatment": treatment,
              "provider_route_id": provider_route["route_id"],
              "provider_route_sha256": provider_route_sha256,
              "requested_model": provider_route["model"],
              "effective_model": "openai/" + provider_route["model"],
              "provider": provider_route["provider"],
              "provider_base_url": provider_route["base_url"],
              "provider_routing": provider_route["provider_routing"],
              "paid_run_approval": {
                  "approved": os.environ["APPROVE_PAID_RUN"].strip().lower() == "true",
                  "input": "approve_paid_run",
              },
              "baseline": manifest["baseline"],
              "matrix": matrix,
          }
          Path("deepswe20-plan.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": matrix}, separators=(",", ":")) + "\n")
              output.write(f"task_count={len(selected_tasks)}\n")
              output.write(f"task_order_sha256={receipt['task_order_sha256']}\n")
              output.write(f"model={provider_route['model']}\n")
              output.write(f"provider_base_url={provider_route['base_url']}\n")
              output.write(
                  "provider_routing_json="
                  + json.dumps(provider_route["provider_routing"], separators=(",", ":"))
                  + "\n"
              )
          PY

      - name: Upload the immutable DeepSWE plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gt-harness-deepswe20-plan-${{ github.run_id }}
          path: deepswe20-plan.json
          if-no-files-found: error

  readiness:
    if: ${{ inputs.readiness_run_id == '' }}
    needs: plan
    uses: ./.github/workflows/deepswe_gt_harness_product.yml

  readiness_binding:
    if: ${{ inputs.readiness_run_id != '' }}
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.readiness_run_id }}
          name: gt-product-provider-free-${{ inputs.readiness_run_id }}
          path: readiness
      - name: Verify referenced readiness run conclusion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
        run: |
          set -euo pipefail
          conclusion="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${READINESS_RUN_ID}" | jq -r '.conclusion')"
          test "$conclusion" = success
      - name: Validate reusable readiness receipt
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          READINESS_RUN_ID: ${{ inputs.readiness_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads((Path("readiness") / "workflow-run.json").read_text())
          closeout = json.loads((Path("readiness") / "product-closeout.json").read_text())
          if receipt.get("schema") != "gt.workflow_run_receipt.v1": raise SystemExit("readiness schema mismatch")
          if receipt.get("status") != "success" or str(receipt.get("run_id")) != os.environ["READINESS_RUN_ID"]: raise SystemExit("readiness run mismatch")
          if receipt.get("head_sha") != os.environ["SOURCE_SHA"]: raise SystemExit("readiness source mismatch")
          if receipt.get("provider_calls") != 0 or receipt.get("benchmark_runs") != 0: raise SystemExit("readiness was not provider-free")
          if closeout.get("status") != "VERIFIED_PROVIDER_FREE" or closeout.get("release_eligible") is not True: raise SystemExit("readiness closeout invalid")
          PY

  image_digest_gate:
    # Legacy readiness path: needs: [plan, readiness, image_digest_gate]
    if: ${{ always() && (needs.readiness.result == 'success' || needs.readiness_binding.result == 'success') }}
    needs: [plan, readiness, readiness_binding]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TASK_MATRIX: ${{ needs.plan.outputs.matrix }}
    steps:
      - name: Verify all exact task-image manifests without provider access
        run: |
          set -euo pipefail
          printf '%s' "$TASK_MATRIX" | jq -c '.include[]' | while read -r TASK_ROW; do
            TASK="$(printf '%s' "$TASK_ROW" | jq -r '.task')"
            IMAGE="$(printf '%s' "$TASK_ROW" | jq -r '.container_image')"
            DIGEST="$(printf '%s' "$TASK_ROW" | jq -r '.container_digest')"
            test -n "$TASK" && test -n "$IMAGE"
            printf '%s' "$DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'
            IMAGE_REF="${IMAGE}@${DIGEST}"
            RAW_MANIFEST="$(mktemp)"
            docker buildx imagetools inspect --raw "$IMAGE_REF" > "$RAW_MANIFEST"
            test -s "$RAW_MANIFEST"
            OBSERVED="$(sha256sum "$RAW_MANIFEST" | awk '{print $1}')"
            test "sha256:${OBSERVED}" = "${DIGEST}"
            printf '%s %s\n' "$TASK" "$IMAGE_REF"
            rm -f "$RAW_MANIFEST"
          done

  provider_gate:
    # Approval guard marker: if: ${{ inputs.approve_paid_run == true }}
    if: ${{ always() && inputs.approve_paid_run == true && needs.image_digest_gate.result == 'success' && (needs.readiness.result == 'success' || needs.readiness_binding.result == 'success') }}
    # Legacy readiness path: needs: [plan, readiness, image_digest_gate, provider_gate]
    needs: [plan, readiness, readiness_binding, image_digest_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      context_window_tokens: ${{ steps.preflight.outputs.context_window_tokens }}
      reserved_output_tokens: ${{ steps.preflight.outputs.reserved_output_tokens }}
      context_window_source: ${{ steps.preflight.outputs.context_window_source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify credential, account limit, and exact model before the matrix
        id: preflight
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          set -euo pipefail
          python -m scripts.provider_preflight \
            --manifest config/provider_route.v1.json \
            --source-sha "${{ needs.plan.outputs.source_sha }}" \
            --output provider-gate.json \
            --live
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path("provider-gate.json").read_text(encoding="utf-8"))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"context_window_tokens={receipt['context_window_tokens']}\n")
              output.write(f"reserved_output_tokens={receipt['reserved_output_tokens']}\n")
              output.write(f"context_window_source={receipt['context_window_source']}\n")
          PY

      - name: Upload provider availability receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gt-harness-deepswe20-provider-gate-${{ github.run_id }}
          path: provider-gate.json
          if-no-files-found: error

  task:
    # Approval guard marker: if: ${{ inputs.approve_paid_run == true }}
    if: ${{ always() && inputs.approve_paid_run == true && needs.provider_gate.result == 'success' }}
    needs: [plan, readiness, readiness_binding, image_digest_gate, provider_gate]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # The frozen DeepSWE smoke has 20 independent tasks. Run the complete
      # cohort concurrently; provider throttling is recorded as infrastructure
      # evidence and never reclassified as a task solve/loss.
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TASK: ${{ matrix.task }}
      ORDINAL: ${{ matrix.ordinal }}
      MODEL: ${{ needs.plan.outputs.model }}
      GT_RETRIEVAL_MODE: hybrid_required
      GT_TREATMENT: groundtruth
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Checkout the immutable DeepSWE snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: datacurve-ai/deep-swe
          ref: 435ee89ec2f2e2289f33b0da4f992f0b7b7266b9
          path: deepswe-bench

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build the checked-in static graph indexer
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
          CC: musl-gcc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
          go test -tags sqlite_fts5 ./...
          go build -tags sqlite_fts5 \
            -ldflags '-linkmode external -extldflags "-static"' \
            -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          file "$RUNNER_TEMP/gt-index" | grep -F "statically linked"
          if readelf -d "$RUNNER_TEMP/gt-index" 2>&1 | grep -q '(NEEDED)'; then
            echo "gt-index contains a dynamic-library dependency" >&2
            exit 1
          fi
          chmod 755 "$RUNNER_TEMP/gt-index"
          # The certified vendored producer is the execution artifact.  The
          # clean build above is a source/toolchain verification only; do not
          # silently execute a different binary with a different digest.

      - name: Pull and verify the exact task image
        env:
          SOURCE_IMAGE: ${{ matrix.container_image }}
          SOURCE_DIGEST: ${{ matrix.container_digest }}
        run: |
          set -euo pipefail
          docker pull "${SOURCE_IMAGE}@${SOURCE_DIGEST}"
          docker image inspect "${SOURCE_IMAGE}@${SOURCE_DIGEST}" >/dev/null
          docker tag "${SOURCE_IMAGE}@${SOURCE_DIGEST}" "$SOURCE_IMAGE"
          docker image inspect "$SOURCE_IMAGE" >/dev/null

      - name: Stage the verified uv installer for the task container
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/uv-install-0.11.32.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$installer" \
            https://releases.astral.sh/github/uv/releases/download/0.11.32/uv-x86_64-unknown-linux-gnu.tar.gz
          echo "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967  $installer" \
            | sha256sum -c -
          echo "GT_UV_INSTALLER_HOST=$installer" >> "$GITHUB_ENV"

      - name: Stage the verified Python runtime for the task container
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cpython-3.12.13-20260718.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            'https://github.com/astral-sh/python-build-standalone/releases/download/20260718/cpython-3.12.13%2B20260718-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz'
          echo "5854aa6ec71cad00334d5065633c210b2e7feb40956767a59a91791cadcf0b79  $archive" \
            | sha256sum -c -
          echo "GT_PYTHON_ARCHIVE_HOST=$archive" >> "$GITHUB_ENV"

      - name: Stage the pinned Python dependency wheelhouse
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/gt-wheelhouse"
          mkdir -p "$wheelhouse"
          python -m pip download --only-binary=:all: --dest "$wheelhouse" \
            "mini-swe-agent==2.4.6" "numpy==2.5.1" \
            "onnxruntime==1.20.1" "tokenizers==0.23.1" \
            "anthropic==0.120.2" "openai==2.50.0" \
            "pydantic==2.13.4" "rich==15.0.0" \
            "mcp==1.27.1" "structlog==25.5.0"
          test -n "$(find "$wheelhouse" -type f -print -quit)"
          echo "GT_WHEELHOUSE_HOST=$wheelhouse" >> "$GITHUB_ENV"

      - name: Build and stage the exact treatment bundle
        env:
          BUNDLE_DIR: ${{ runner.temp }}/gt-treatment-bundle
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          from gt_harness.product import build_product_bundle

          root = Path.cwd()
          output = Path(os.environ["BUNDLE_DIR"])
          bundle = build_product_bundle(
              root / "config/deepswe_product_bundle_v1.json", output_dir=output
          )
          wheel = output / "dist" / bundle["python_wheel"]["filename"]
          records = {
              "GT_GROUNDTRUTH_WHEEL_HOST": root / bundle["groundtruth"]["wheel_path"],
              "GT_INDEX_BINARY_HOST": root / bundle["groundtruth"]["producer_path"],
              "GT_HARNESS_WHEEL_HOST": wheel,
              "GT_HARNESS_WHEEL_SHA256": bundle["python_wheel"]["sha256"],
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              for name, value in records.items():
                  handle.write(f"{name}={value}\n")
          PY
          test -s "$BUNDLE_DIR/product-bundle.json"

      - name: Install Pier and the canonical product source
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            --require-hashes -r config/product-requirements.lock
          python -m pip install --disable-pip-version-check --no-deps "$GT_HARNESS_WHEEL_HOST"
          test "$(python -c 'import importlib.metadata as m; print(m.version("mini-swe-agent"))')" = "2.4.6"
          test "$(python -c 'import importlib.metadata as m; print(m.version("datacurve-pier"))')" = "0.3.1"

      - name: Provision the pinned local retrieval model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971  $model_dir/model.onnx" | sha256sum -c -
          echo "91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854  $model_dir/tokenizer.json" | sha256sum -c -
          echo "GT_DENSE_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - name: Provision the pinned language servers
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.24"
          cache: false

      - name: Stage the pinned language servers for LSP promotion
        run: |
          set -euo pipefail
          lsp_bin="$RUNNER_TEMP/lsp-bin"
          mkdir -p "$lsp_bin"

          # gopls: module-only, so version-pinned and checksum-verified by the
          # Go module proxy against sum.golang.org.
          GOBIN="$lsp_bin" go install golang.org/x/tools/gopls@v0.23.0

          # rust-analyzer: released as a binary, pinned by tag and digest.
          ra_gz="$RUNNER_TEMP/rust-analyzer.gz"
          curl -fsSL -o "$ra_gz" \
            https://github.com/rust-lang/rust-analyzer/releases/download/2026-08-31/rust-analyzer-x86_64-unknown-linux-gnu.gz
          echo "a775f9edb543bb0c077da339b783e89446092986cde921c9d8e1733b091080c6  $ra_gz" | sha256sum -c -
          gunzip -c "$ra_gz" > "$lsp_bin/rust-analyzer"
          chmod 755 "$lsp_bin"/*

          # Fail loudly rather than staging an empty directory: a silently
          # skipped provisioning step is how LSP stayed nominally on while
          # contributing nothing.
          test -x "$lsp_bin/gopls"
          test -x "$lsp_bin/rust-analyzer"

          # python, typescript and javascript are 12 of the 20 cohort tasks and
          # their servers are npm packages. The task container has no network and
          # no guaranteed Node, so the runtime is staged alongside them, exactly
          # as the Python runtime already is.
          node_tar="$RUNNER_TEMP/node.tar.xz"
          curl -fsSL -o "$node_tar" \
            https://nodejs.org/dist/v24.20.0/node-v24.20.0-linux-x64.tar.xz
          echo "2f2c0da162318f0de47665410c7c8c2ed3d36c8f3105de4bbc61176c70a7cbf2  $node_tar" | sha256sum -c -
          node_root="$lsp_bin/node-runtime"
          mkdir -p "$node_root"
          tar -xJf "$node_tar" -C "$node_root" --strip-components=1

          # Versions pinned; npm verifies package integrity against the
          # registry-provided hashes it records while installing.
          "$node_root/bin/npm" install --prefix "$node_root/servers" --no-fund --no-audit \
            pyright@1.1.413 \
            typescript-language-server@6.0.0 \
            typescript@7.0.2

          # Explicit shims rather than npm bin symlinks: symlinks do not survive
          # the upload into the task environment, and a broken shim would look
          # exactly like an absent server. Written with printf so the shebang
          # stays on column zero inside this YAML block.
          printf '#!/bin/sh\nexec "%s/bin/node" "%s/servers/node_modules/%s" "$@"\n' \
            "/installed-agent/lsp-bin/node-runtime" "/installed-agent/lsp-bin/node-runtime" "pyright/langserver.index.js" > "$lsp_bin/pyright-langserver"
          printf '#!/bin/sh\nexec "%s/bin/node" "%s/servers/node_modules/%s" "$@"\n' \
            "/installed-agent/lsp-bin/node-runtime" "/installed-agent/lsp-bin/node-runtime" "typescript-language-server/lib/cli.mjs" > "$lsp_bin/typescript-language-server"
          chmod 755 "$lsp_bin/pyright-langserver" "$lsp_bin/typescript-language-server"

          test -x "$node_root/bin/node"
          test -f "$node_root/servers/node_modules/pyright/langserver.index.js"
          test -f "$node_root/servers/node_modules/typescript-language-server/lib/cli.mjs"

          echo "GT_LSP_BIN_HOST=$lsp_bin" >> "$GITHUB_ENV"

      - name: Mint the host-only resource attestation key
        run: |
          python - <<'PY'
          import os
          import secrets

          key = secrets.token_hex(32)
          print(f"::add-mask::{key}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"GT_RESOURCE_ATTESTATION_KEY={key}\n")
          PY

      - name: Run DeepSWE through the released gt-harness run boundary
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_BASE_URL: ${{ needs.plan.outputs.provider_base_url }}
          GT_PROVIDER_CONTEXT_WINDOW_TOKENS: ${{ needs.provider_gate.outputs.context_window_tokens }}
          GT_PROVIDER_RESERVED_OUTPUT_TOKENS: ${{ needs.provider_gate.outputs.reserved_output_tokens }}
          GT_PROVIDER_CONTEXT_WINDOW_SOURCE: ${{ needs.provider_gate.outputs.context_window_source }}
          GT_PROVIDER_ROUTING_JSON: ${{ needs.plan.outputs.provider_routing_json }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          pier run \
            -p deepswe-bench/tasks \
            --include-task-name "$TASK" \
            --agent-import-path eval.pier_gt_harness_adapter:PierGtHarnessMiniSwe246Agent \
            -m "$MODEL" \
            --environment-import-path eval.pier_filtered_docker:PierFilteredDockerEnvironment \
            -o results/deepswe \
            --job-name "deepswe-gt-harness-${GITHUB_RUN_ID}-${TASK}" \
            --agent-timeout-multiplier "${{ matrix.agent_timeout_multiplier }}" \
            -n 1 \
            -y \
            --ak task_id="$TASK" \
            --ak product_source_sha="${{ needs.plan.outputs.source_sha }}" \
            --ak temperature=1.0 \
            --ak max_iterations=300 \
            --ak time_budget_seconds="${{ matrix.time_budget_seconds }}"

      - name: Bind the Pier reward to the canonical product receipt
        if: always()
        run: |
          python -m scripts.standardize_benchmark_result \
            --root results/deepswe \
            --suite deepswe \
            --task-id "$TASK" \
            --source-sha "${{ needs.plan.outputs.source_sha }}"

      - name: Normalize task evidence ownership for archival
        if: always()
        run: |
          set -euo pipefail
          test -d results/deepswe
          sudo chown -R --no-dereference "$(id -u):$(id -g)" results/deepswe
          chmod -R u+rwX results/deepswe

      - name: Upload DeepSWE verifier and GT Harness product evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gt-harness-deepswe20-task-${{ matrix.ordinal }}-${{ github.run_id }}
          path: results/deepswe/
          if-no-files-found: error

  attest:
    if: ${{ always() && inputs.approve_paid_run == true }}
    needs: [plan, provider_gate, task]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.plan.outputs.source_sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install pinned attestation test dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --require-hashes -r config/product-requirements.lock
          echo "2d0483c43cd7209d7049439af963d420666bc853854b21e8a82e07236b00ee0e  vendor/groundtruth_mcp-1.0.0-py3-none-any.whl" | sha256sum --check --strict
          python -m pip install --disable-pip-version-check --no-deps \
            vendor/groundtruth_mcp-1.0.0-py3-none-any.whl
          python -c "import groundtruth.runtime.gateway"

      - name: Download immutable plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gt-harness-deepswe20-plan-${{ github.run_id }}
          path: attestation

      - name: Download provider gate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: gt-harness-deepswe20-provider-gate-${{ github.run_id }}
          path: attestation

      - name: Download all task artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: gt-harness-deepswe20-task-*-${{ github.run_id }}
          path: attestation/tasks
          merge-multiple: true

      - name: Reject dark triggers, telemetry faults, and stale feature evidence
        env:
          EXPECTED_MODEL: ${{ needs.plan.outputs.model }}
        run: |
          set -uo pipefail
          AUDIT_EXIT=0
          LIVE_EXIT=0
          MATRIX_ISSUE_EXIT=0
          MATRIX_VERIFY_EXIT=0
          python scripts/gt_audit.py attestation/tasks \
            --source-sha "${{ needs.plan.outputs.source_sha }}" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --json attestation/gt-audit.json || AUDIT_EXIT=$?
          TASK_COUNT="$(python -c "import json; print(json.load(open('attestation/deepswe20-plan.json'))['task_count'])")"
          python scripts/gt_live_gate.py attestation/gt-audit.json \
            --run-dir attestation/tasks \
            --expected-tasks "$TASK_COUNT" \
            --expected-model "$EXPECTED_MODEL" \
            --min-witnessed 0 \
            --min-exercised 0 \
            --require-complete-census \
            --json attestation/gt-live-gate.json || LIVE_EXIT=$?
          python scripts/issue_feature_matrix.py \
            --output attestation/feature-matrix.json \
            --markdown-output attestation/feature-matrix.md || MATRIX_ISSUE_EXIT=$?
          if test -f attestation/feature-matrix.json; then
            python scripts/verify_feature_matrix.py attestation/feature-matrix.json || MATRIX_VERIFY_EXIT=$?
          else
            MATRIX_VERIFY_EXIT=1
          fi
          if test "$AUDIT_EXIT" -ne 0 || test "$LIVE_EXIT" -ne 0 || \
             test "$MATRIX_ISSUE_EXIT" -ne 0 || test "$MATRIX_VERIFY_EXIT" -ne 0; then
            exit 1
          fi

      - name: Diagnose every staged task artifact
        if: always()
        run: |
          set -uo pipefail
          diagnostic_exit=0
          python -m scripts.diagnose_benchmark_run --root attestation --strict > attestation/diagnostics-console.txt || diagnostic_exit=$?
          test "$diagnostic_exit" -eq 0

      - name: Verify all DeepSWE outcomes and product receipts
        if: always()
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          TASK_JOB_RESULT: ${{ needs.task.result }}
        run: |
          set -euo pipefail
          python -m scripts.attest_deepswe \
            --root attestation \
            --source-sha "$SOURCE_SHA" \
            --task-job-result "$TASK_JOB_RESULT" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output attestation/deepswe20-attestation.json
      - name: Upload final DeepSWE GT Harness attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gt-harness-deepswe20-attestation-${{ github.run_id }}
          path: |
            attestation/deepswe20-attestation.json
            attestation/gt-audit.json
            attestation/gt-live-gate.json
            attestation/feature-matrix.json
            attestation/diagnostic-summary.json
            attestation/diagnostics-console.txt
          if-no-files-found: error
