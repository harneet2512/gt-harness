name: "GT Harness: DeepSWE product smoke20 entrypoint"

on:
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Immutable GT Harness commit or branch to evaluate"
        required: false
        type: string
      treatment:
        description: "Treatment arm: bare control or groundtruth"
        required: false
        type: string
        default: groundtruth

permissions:
  contents: read
  packages: read

# This registered filename existed before the product workflow was introduced.
# Keep it as the dispatch entrypoint so GitHub can run branch revisions without
# requiring an unrelated default-branch merge.  The historical central-agent
# implementation remains recoverable from Git history; it is not a production
# treatment and must not be dispatched as current GT Harness.
jobs:
  product:
    uses: ./.github/workflows/deepswe_gt_harness_product.yml
    with:
      code_ref: ${{ inputs.code_ref || github.sha }}
      treatment: ${{ inputs.treatment || 'groundtruth' }}
    secrets: inherit
