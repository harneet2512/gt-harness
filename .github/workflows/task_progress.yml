name: Task progress monitor

on:
  workflow_call:
    inputs:
      expected_total:
        description: "Expected number of task jobs"
        required: false
        type: string
        default: ""
      expected_tasks_json:
        description: "JSON task list or matrix include object"
        required: false
        type: string
        default: ""
      task_job_regex:
        description: "Regex matching only the task matrix job names"
        required: true
        type: string
      gate_job_regex:
        description: "Regex matching the planning job"
        required: false
        type: string
        default: "^(prepare|plan)$"
      poll_seconds:
        description: "Seconds between progress snapshots"
        required: false
        type: string
        default: "30"
      monitor_timeout_minutes:
        description: "Monitor lifetime, matching the benchmark job backstop"
        required: false
        type: string
        default: "350"
      checkpoint_every:
        description: "Emit a durable progress checkpoint after this many completed tasks"
        required: false
        type: string
        default: "20"

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    name: Task progress
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.monitor_timeout_minutes) }}
    steps:
      - name: Publish live task progress
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EXPECTED_TOTAL: ${{ inputs.expected_total }}
          EXPECTED_TASKS_JSON: ${{ inputs.expected_tasks_json }}
          TASK_JOB_REGEX: ${{ inputs.task_job_regex }}
          GATE_JOB_REGEX: ${{ inputs.gate_job_regex }}
          POLL_SECONDS: ${{ inputs.poll_seconds }}
          CHECKPOINT_EVERY: ${{ inputs.checkpoint_every }}
          MONITOR_TIMEOUT_MINUTES: ${{ inputs.monitor_timeout_minutes }}
        run: |
          set -euo pipefail

          api_headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          expected="${EXPECTED_TOTAL:-}"
          if [[ -z "$expected" && -n "${EXPECTED_TASKS_JSON:-}" ]]; then
            expected="$(python3 -c 'import json,sys; value=json.loads(sys.argv[1]); print(len(value if isinstance(value,list) else value.get("include", [])))' "$EXPECTED_TASKS_JSON")"
          fi
          [[ "$expected" =~ ^[0-9]+$ ]] || expected=0

          final_stats="0 0 0 0 0 0 0 0"
          checkpoints_file="$RUNNER_TEMP/task_progress_checkpoints.jsonl"
          : > "$checkpoints_file"
          checkpoint_every="${CHECKPOINT_EVERY:-20}"
          [[ "$checkpoint_every" =~ ^[1-9][0-9]*$ ]] || checkpoint_every=20
          next_checkpoint="$checkpoint_every"
          monitor_minutes="${MONITOR_TIMEOUT_MINUTES:-350}"
          [[ "$monitor_minutes" =~ ^[1-9][0-9]*$ ]] || monitor_minutes=350
          deadline=$(( $(date +%s) + monitor_minutes * 60 ))
          while (( $(date +%s) < deadline )); do
            jobs_url="https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100"
            if ! jobs_json="$(curl --fail --silent --show-error --retry 3 "${api_headers[@]}" "$jobs_url")"; then
              echo "::warning::TASK_PROGRESS_QUERY_FAILED run=${RUN_ID}"
              sleep "$POLL_SECONDS"
              continue
            fi

            stats="$(jq -r --arg regex "$TASK_JOB_REGEX" '
              [.jobs[] | select(.name | test($regex))] as $tasks |
              [
                ($tasks | length),
                ($tasks | map(select(.status == "completed")) | length),
                ($tasks | map(select(.conclusion == "success")) | length),
                ($tasks | map(select(.conclusion == "failure")) | length),
                ($tasks | map(select(.conclusion == "timed_out")) | length),
                ($tasks | map(select(.conclusion == "cancelled")) | length),
                ($tasks | map(select(.status == "in_progress")) | length),
                ($tasks | map(select(.status == "queued")) | length)
              ] | @tsv' <<< "$jobs_json")"
          read -r observed completed success failed infra_timeout cancelled in_progress queued <<< "$stats"
          final_stats="$observed $completed $success $failed $infra_timeout $cancelled $in_progress $queued"
          total="$expected"
          if (( total == 0 )); then total="$observed"; fi
          success_gate=$(( (total + 9) / 10 ))
          if (( total > 0 && success >= success_gate )); then
            echo "TASK_PROGRESS_SUCCESS_GATE reached=${success_gate} successful=${success} total=${total}"
          fi
          while (( completed >= next_checkpoint )); do
              jq -cn --argjson checkpoint "$next_checkpoint" --argjson total "$total" --argjson completed "$completed" --argjson success "$success" --argjson failed "$failed" --argjson infra_timeout "$infra_timeout" --argjson cancelled "$cancelled" --argjson in_progress "$in_progress" --argjson queued "$queued" '{checkpoint, total, completed, success, failed, infra_timeout, cancelled, in_progress, queued}' >> "$checkpoints_file"
              echo "TASK_PROGRESS_CHECKPOINT checkpoint=${next_checkpoint} total=${total} completed=${completed} success=${success} failed=${failed} infra_timeout=${infra_timeout} cancelled=${cancelled} in_progress=${in_progress} queued=${queued}"
              next_checkpoint=$(( next_checkpoint + checkpoint_every ))
            done

            remaining=$(( total - completed )); (( remaining < 0 )) && remaining=0
            echo "TASK_PROGRESS total=${total} completed=${completed} success=${success} failed=${failed} infra_timeout=${infra_timeout} cancelled=${cancelled} in_progress=${in_progress} queued=${queued} remaining=${remaining}"

            if (( total > 0 && completed >= total )); then break; fi

            if (( expected == 0 )); then
              gate_done="$(jq -r --arg regex "$GATE_JOB_REGEX" '[.jobs[] | select(.name | test($regex)) | select(.status == "completed")] | length' <<< "$jobs_json")"
              if (( gate_done > 0 )); then
                echo "::warning::TASK_PROGRESS_NO_MATRIX gate job completed before a task matrix was created"
                break
              fi
            fi
            sleep "$POLL_SECONDS"
          done

          read -r observed completed success failed infra_timeout cancelled in_progress queued <<< "$final_stats"
          total="$expected"
          if (( total == 0 )); then total="$observed"; fi
          remaining=$(( total - completed )); (( remaining < 0 )) && remaining=0
          {
            echo "## Task progress"
            echo
            echo "| Metric | Count |"
            echo "|---|---:|"
            echo "| Total tasks | ${total} |"
            echo "| Completed | ${completed} |"
            echo "| Successful task jobs | ${success} |"
            echo "| 10% successful-task gate | ${success_gate} |"
            echo "| Failed task jobs | ${failed} |"
            echo "| Infrastructure timeouts | ${infra_timeout} |"
            echo "| Cancelled task jobs | ${cancelled} |"
            echo "| In progress | ${in_progress} |"
            echo "| Queued | ${queued} |"
            echo "| Remaining | ${remaining} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "### Checkpoints (every ${checkpoint_every} completed tasks)" >> "$GITHUB_STEP_SUMMARY"
          echo '```jsonl' >> "$GITHUB_STEP_SUMMARY"
          cat "$checkpoints_file" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload durable progress checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-progress-${{ github.run_id }}
          path: ${{ runner.temp }}/task_progress_checkpoints.jsonl
          if-no-files-found: error
