# Terminal-Bench 2.0 MINI-SWE CENTRAL RUNTIME matrix, one job per task.
#
# Same shape as the GT-off baseline matrix, but runs the host-owned GT-on
# control plane (eval.gt_central_agent:MiniSweCentralAgent). Private runtime
# code, state, provider credentials, and feature configuration stay on the
# Harbor host; only literal model-selected Bash commands enter the task image.
#
# Matched repair-mix control for the frozen GT-off baseline (17/20 on this
# selected slice). The default pool covers every known outcome regression,
# known GT-working trajectories, and prior GT-on flips. This is not a
# leaderboard submission; clear `include` explicitly before any full run.
# --agent-timeout-multiplier 1.0. Do not rerun the baseline.
name: TB2 miniswe central matrix (GT-on)

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id for harbor -m, passed through verbatim when base_url is set (api.deepseek.com wants bare 'deepseek-v4-flash')"
        type: string
        default: "deepseek-v4-flash"
      base_url:
        description: "OpenAI-compatible gateway URL; exported as OPENAI_BASE_URL (overrides the repo secret)"
        type: string
        default: ""
      parallel:
        description: "Max concurrent task jobs (GHA concurrency cap)"
        type: string
        default: "10"
      include:
        description: "20-task repair mix by default; clear explicitly only for an authorized full run"
        type: string
        default: "extract-elf,mcmc-sampling-stan,prove-plus-comm,qemu-alpine-ssh,regex-chess,sanitize-git-repo,torch-tensor-parallelism,video-processing,winning-avg-corewars,write-compressor,headless-terminal,portfolio-optimization,schemelike-metacircular-eval,cobol-modernization,llm-inference-batching-scheduler,fix-code-vulnerability,feal-linear-cryptanalysis,count-dataset-tokens,largest-eigenval,torch-pipeline-parallelism"
      exclude:
        description: "Optional comma-separated task names/globs to drop from the pool"
        type: string
        default: ""
      dataset:
        description: "Harbor dataset name@version"
        type: string
        default: "terminal-bench@2.0"
      image_tag:
        description: "Task image tag (all TB2.0 task images are alexgshaw/<task>:<tag>). Cache key component; bump when the dataset images change"
        type: string
        default: "20251031"
      ref:
        description: "Repository ref to check out (the ENGINE code lives on the inline-engine branch)"
        type: string
        default: "inline-engine"
      arm:
        description: "Conservative component arm; paid execution still requires the pre-smoke gate"
        type: choice
        options: [off, audit, certified_context, certified_controllers, certified_full]
        default: audit
      feature:
        description: "Integrated all-17 runtime (component behavior is selected by arm)"
        type: choice
        options: [integrated]
        default: integrated
      replay_capture:
        description: "Capture bounded provider requests/responses for deterministic trajectory replay (paid; default off)"
        type: boolean
        default: false
      step_limit:
        description: "Maximum Mini-SWE model calls per task; use 1 only for authorized decision-point capture"
        type: string
        default: "100"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tasks: ${{ steps.enum.outputs.tasks }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      GT_INDEX_BINARY: ${{ github.workspace }}/vendor/gt-index-linux-amd64
      SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
      SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index from the checked-out source
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          chmod +x vendor/gt-index-linux-amd64
          python -m pip install -e '.[retrieval]' "mini-swe-agent==2.2.8" "harbor==0.20.0" \
            vendor/groundtruth_mcp-*.whl

      - name: Provision pinned Snowflake ONNX runtime asset
        if: ${{ inputs.arm == 'certified_context' || inputs.arm == 'certified_full' }}
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" | sha256sum -c -

      - name: Prove repository intelligence substrate
        run: python scripts/verify_gt_index_runtime.py

      - name: Prove pinned language contract
        run: python scripts/verify_tb2_language_contract.py

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned, notes = [], []
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if clean != raw:
                  notes.append(f"{name}: removed {len(raw) - len(clean)} stray char(s)")
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping "
                        "BOM/whitespace - it cannot be sent as an HTTP header")
                  sys.exit(1)
              cleaned.append((name, clean))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          for n in notes:
              print(f"::warning::{n}")
          EOF

      - name: Preflight provider (gates all jobs)
        env:
          MODEL: ${{ inputs.model }}
        run: |
          # Keep provider stalls from consuming the full 20-minute plan job.
          # Coreutils timeout terminates the Python process; a thread timeout
          # would leave the underlying HTTP request alive.
          timeout --signal=TERM 150s python - <<'EOF'
          import os, sys
          import litellm

          model = os.environ["MODEL"]
          base = os.environ.get("OPENAI_BASE_URL") or ""
          mname, kwargs = model, {"temperature": 1.0}
          if base and "/" not in model:
              mname = f"openai/{model}"
              kwargs["api_base"] = base
          print(f"model={model!r} -> litellm model={mname!r} "
                f"OPENAI_BASE_URL={base or '(unset)'}")
          try:
              resp = litellm.completion(
                  model=mname,
                  messages=[{"role": "user",
                             "content": "Reply with the single word: ok"}],
                  **kwargs,
              )
          except Exception as e:
              print(f"::error::preflight failed: {type(e).__name__}: {e}")
              print("No task jobs were spawned and no task images were pulled.")
              sys.exit(1)
          d = resp.model_dump()
          text = (d.get("choices") or [{}])[0].get("message", {}).get("content") or ""
          print(f"preflight ok: served_model={d.get('model')} "
                f"system_fingerprint={d.get('system_fingerprint')} "
                f"usage={d.get('usage')} text={text[:80]!r}")
          EOF

      - name: Enumerate dataset tasks
        id: enum
        env:
          DATASET: ${{ inputs.dataset }}
          INCLUDE: ${{ inputs.include }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o ds --export
          python - <<'EOF'
          import fnmatch, json, os
          from pathlib import Path

          dataset = os.environ["DATASET"]
          root = Path("ds") / dataset.split("@", 1)[0]
          tasks = sorted(p.name for p in root.iterdir() if p.is_dir())
          if not tasks:
              raise SystemExit(f"::error::no tasks found under {root}")

          def patterns(raw):
              return [s.strip() for s in raw.split(",") if s.strip()]

          inc, exc = patterns(os.environ["INCLUDE"]), patterns(os.environ["EXCLUDE"])
          if inc:
              tasks = [t for t in tasks if any(fnmatch.fnmatch(t, p) for p in inc)]
          if exc:
              tasks = [t for t in tasks if not any(fnmatch.fnmatch(t, p) for p in exc)]
          if not tasks:
              raise SystemExit("::error::include/exclude filtered every task out")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tasks={json.dumps(tasks)}\n")

          summary = [f"## Plan: {len(tasks)} tasks as individual jobs", ""]
          summary.append("`" + ", ".join(tasks) + "`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          EOF

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || secrets.OPENAI_BASE_URL }}
      PYTHONUTF8: "1"
      GT_INDEX_BINARY: ${{ github.workspace }}/vendor/gt-index-linux-amd64
      # Provider credentials remain on the Harbor host. The external agent
      # passes an empty env mapping to every model-selected task command.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index from the checked-out source
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          chmod +x vendor/gt-index-linux-amd64
          pip install -e . "mini-swe-agent==2.2.8" "harbor==0.20.0" \
            vendor/groundtruth_mcp-*.whl

      - name: Prove repository intelligence substrate
        run: python scripts/verify_gt_index_runtime.py

      - name: Prove pinned language contract
        run: python scripts/verify_tb2_language_contract.py

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned = []
          for name in ("OPENAI_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping")
                  sys.exit(1)
              cleaned.append((name, clean))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          EOF

      - name: Restore task image from cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ matrix.task }}-${{ inputs.image_tag }}

      - name: Load cached task image
        if: steps.restore.outputs.cache-hit == 'true'
        run: |
          docker load -i "${{ runner.temp }}/tb2-img.tar.gz"
          echo "loaded task image from cache for ${{ matrix.task }}"

      - name: Resolve Harbor's exact task-owned agent budget
        env:
          DATASET: ${{ inputs.dataset }}
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o ds --export
          DATASET_NAME="${DATASET%@*}"
          TASK_CONFIG="ds/${DATASET_NAME}/${TASK}/task.toml"
          mkdir -p results/terminal-bench
          EXECUTION_BUDGET=$(python scripts/resolve_harbor_budget.py \
            --task-config "$TASK_CONFIG" \
            --multiplier 1.0 \
            --output "results/terminal-bench/harbor-budget-${TASK}.json")
          echo "EXECUTION_BUDGET=${EXECUTION_BUDGET}" >> "$GITHUB_ENV"
          echo "resolved Harbor agent budget: ${EXECUTION_BUDGET}s"

      - name: Run harbor - task ${{ matrix.task }}
        id: harbor
        env:
          MODEL: ${{ inputs.model }}
          DATASET: ${{ inputs.dataset }}
          TASK: ${{ matrix.task }}
          ARM: ${{ inputs.arm }}
          FEATURE: ${{ inputs.feature }}
          REPLAY_CAPTURE: ${{ inputs.replay_capture }}
          STEP_LIMIT: ${{ inputs.step_limit }}
        run: |
          set -uo pipefail
          AGENT="eval.gt_central_agent:MiniSweCentralAgent"
          [ "$FEATURE" = "integrated" ] || { echo "::error::unknown feature: $FEATURE"; exit 2; }
          FEATURE_ARGS=()
          case "$ARM" in
            off)
              FEATURE_ARGS+=(
                --ak integration_mode=off --ak policy_mode=off --ak preflight_mode=off
                --ak enable_preemptive_retrieval=false
                --ak enable_all_features=false --ak enable_submit_readiness=false
                --ak enable_lint=false --ak enable_feature_guidance=false
                --ak enable_context_frontier=false --ak enable_context_compaction=false
                --ak enable_completion_controller=false --ak enable_progress_control=false
                --ak enable_adaptive_validation_timeout=false --ak require_graph_ready=false
              ) ;;
            audit)
              FEATURE_ARGS+=(
                --ak integration_mode=audit --ak policy_mode=audit --ak preflight_mode=shadow
                --ak enable_preemptive_retrieval=false
                --ak enable_all_features=true --ak enable_submit_readiness=true
                --ak enable_repository_intelligence=true
                --ak enable_lint=false --ak enable_feature_guidance=false
                --ak enable_context_frontier=false --ak enable_context_compaction=false
                --ak enable_completion_controller=false --ak enable_progress_control=false
                --ak enable_adaptive_validation_timeout=false --ak require_graph_ready=false
              ) ;;
            certified_context)
              FEATURE_ARGS+=(
                --ak integration_mode=active --ak policy_mode=certified_active
                --ak enable_all_features=true --ak enable_submit_readiness=true
                --ak enable_repository_intelligence=true
                --ak preflight_mode=shadow --ak enable_lint=false
                --ak enable_feature_guidance=true --ak enable_context_frontier=true
                --ak enable_preemptive_retrieval=true
                --ak preemptive_retrieval_model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
                --ak enable_context_compaction=false --ak enable_completion_controller=false
                --ak enable_progress_control=false --ak enable_adaptive_validation_timeout=false
                --ak require_graph_ready=true
              ) ;;
            certified_controllers)
              FEATURE_ARGS+=(
                --ak integration_mode=active --ak policy_mode=certified_active
                --ak enable_all_features=false --ak enable_submit_readiness=false
                --ak enable_repository_intelligence=false
                --ak preflight_mode=shadow --ak enable_lint=true
                --ak enable_feature_guidance=false --ak enable_context_frontier=false
                --ak enable_preemptive_retrieval=false
                --ak enable_context_compaction=false --ak enable_completion_controller=true
                --ak enable_progress_control=true --ak enable_adaptive_validation_timeout=true
                --ak require_graph_ready=false
              ) ;;
            certified_full)
              FEATURE_ARGS+=(
                --ak integration_mode=active --ak policy_mode=certified_active
                --ak enable_all_features=true --ak enable_submit_readiness=true
                --ak enable_repository_intelligence=true
                --ak preflight_mode=shadow --ak enable_lint=true
                --ak enable_feature_guidance=true --ak enable_context_frontier=true
                --ak enable_preemptive_retrieval=true
                --ak preemptive_retrieval_model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
                --ak enable_context_compaction=true --ak enable_completion_controller=true
                --ak enable_progress_control=true --ak enable_adaptive_validation_timeout=true
                --ak require_graph_ready=true
              ) ;;
            *) echo "::error::unknown arm: $ARM"; exit 2 ;;
          esac
          FEATURE_ARGS+=(
            --ak execution_budget_sec="$EXECUTION_BUDGET"
            --ak enable_task_start_advisory=false
            --ak enable_replay_capture="$REPLAY_CAPTURE"
            --ak step_limit="$STEP_LIMIT"
          )
          JOB_NAME="tb2-miniswe-central-${ARM}-${FEATURE}-${GITHUB_RUN_ID}-${TASK}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          harbor run \
            -d "$DATASET" \
            --agent-import-path "$AGENT" \
            -m "$MODEL" \
            -o results/terminal-bench \
            --job-name "$JOB_NAME" \
            --agent-timeout-multiplier 1.0 \
            -n 1 \
            -y \
            "${FEATURE_ARGS[@]}" \
            -i "$TASK"

      - name: Cache task image for future runs
        if: steps.restore.outputs.cache-hit != 'true'
        id: saveimg
        env:
          TASK: ${{ matrix.task }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          IMG="alexgshaw/${TASK}:${IMAGE_TAG}"
          set +e
          SIZE=$(docker image inspect --format '{{.Size}}' "$IMG" 2>/dev/null)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "image $IMG not present; nothing to cache"
            exit 0
          fi
          if [ "$SIZE" -gt 1500000000 ]; then
            echo "image ${TASK} is $SIZE bytes (>1.5GB); skipping cache to protect the budget"
            exit 0
          fi
          docker save "$IMG" | gzip -1 > "${{ runner.temp }}/tb2-img.tar.gz"
          echo "cached=1" >> "$GITHUB_OUTPUT"
          echo "saved ${TASK} image ($SIZE bytes) for future runs"

      - name: Upload task image cache
        if: steps.restore.outputs.cache-hit != 'true' && steps.saveimg.outputs.cached == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ matrix.task }}-${{ inputs.image_tag }}

      - name: Fix artifact permissions
        if: always()
        run: |
          # Some task verifiers still return root-owned result artifacts.
          sudo find results -type f -exec chmod a+r {} + 2>/dev/null || \
            sudo chmod -R a+r results || true

      - name: Disk after run
        if: always()
        run: df -h /

      - name: Upload task result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-central-${{ inputs.arm }}-${{ inputs.feature }}-${{ github.run_id }}-task-${{ matrix.task }}
          path: results/terminal-bench/
          if-no-files-found: warn

  merge:
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all task artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tb2-miniswe-central-${{ inputs.arm }}-${{ inputs.feature }}-${{ github.run_id }}-task-*
          path: tasks
          merge-multiple: false

      - name: Merge task results
        env:
          EXPECTED_TASKS_JSON: ${{ needs.plan.outputs.tasks }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from pathlib import Path

          from gt_engine.deep_metrics import extract_trajectory

          expected = json.loads(os.environ.get("EXPECTED_TASKS_JSON") or "[]")
          trials, missing, per_task, receipt_metrics = [], [], [], []
          deep_tasks = {}

          def solved(t):
              rewards = (t.get("verifier_result") or {}).get("rewards") or {}
              vals = [v for v in rewards.values() if isinstance(v, (int, float))]
              return bool(vals) and all(v >= 1 for v in vals)

          for task_dir in sorted(Path("tasks").glob("*")):
              task_name = task_dir.name.split("-task-", 1)[-1]
              receipt_paths = list(task_dir.rglob("central_receipt.json"))
              if receipt_paths:
                  receipt = json.loads(receipt_paths[0].read_text(encoding="utf-8"))
                  metrics = receipt.get("metrics") or {}
                  intelligence = receipt.get("repository_intelligence") or {}
                  receipt_metrics.append({
                      "task": task_name,
                      "feature_count": (receipt.get("features") or {}).get("feature_count"),
                      "features_enabled": (receipt.get("features") or {}).get("enabled"),
                      "sensor_healthy": receipt.get("workspace_sensor_healthy"),
                      "input_tokens": metrics.get("input_tokens"),
                      "output_tokens": metrics.get("output_tokens"),
                      "cache_tokens": metrics.get("cache_tokens"),
                      "total_tokens": metrics.get("total_tokens"),
                      "api_calls": metrics.get("api_calls"),
                      "actions": metrics.get("actions"),
                      "effective_task_actions": metrics.get("effective_task_actions"),
                      "actual_environment_execs": metrics.get("actual_environment_execs"),
                      "controller_environment_execs": metrics.get("controller_environment_execs"),
                      "controller_cached_reads": metrics.get("controller_cached_reads"),
                      "sensor_environment_execs": metrics.get("sensor_environment_execs"),
                      "assistant_steps": metrics.get("assistant_steps"),
                      "trajectory_messages": metrics.get("trajectory_messages"),
                      "guidance_events": metrics.get("guidance_events"),
                      "guidance_chars": metrics.get("guidance_chars"),
                      "guidance_candidates": metrics.get("guidance_candidates"),
                      "guidance_suppressed": metrics.get("guidance_suppressed"),
                      "uncached_input_tokens": metrics.get("uncached_input_tokens"),
                      "cache_hit_rate": metrics.get("prompt_cache_hit_rate"),
                      "successful_actions": metrics.get("successful_actions"),
                      "failed_actions": metrics.get("failed_actions"),
                      "check_actions": metrics.get("check_actions"),
                      "workspace_change_actions": metrics.get("workspace_change_actions"),
                      "repeated_commands": metrics.get("repeated_commands"),
                      "censored": metrics.get("censored"),
                      "censored_reason": metrics.get("censored_reason"),
                      "repository_intelligence_status": intelligence.get("status"),
                      "repository_intelligence_applicability": intelligence.get("applicability"),
                      "repository_intelligence_denominator_excluded": bool(
                          intelligence.get("denominator_excluded")
                      ),
                      "repository_intelligence_required": intelligence.get("required"),
                      "repository_intelligence_failures": intelligence.get("failures") or [],
                      "repository_intelligence_transient_failures": (
                          intelligence.get("transient_failures") or []
                      ),
                      "repository_graph_degraded_fallback": bool(
                          metrics.get("repository_graph_degraded_fallback")
                          or (intelligence.get("graph_gate") or {}).get("degraded_fallback")
                      ),
                      "repository_graph_schema_valid": metrics.get("repository_graph_schema_valid"),
                      "repository_graph_nodes": metrics.get("repository_graph_nodes"),
                      "repository_graph_edges": metrics.get("repository_graph_edges"),
                      "repository_mirror_transfer_ms": metrics.get("repository_mirror_transfer_ms"),
                      "repository_index_refresh_ms": metrics.get("repository_index_refresh_ms"),
                      "context_frontier_deliveries": metrics.get("context_frontier_deliveries"),
                      "context_frontier_chars_added": metrics.get("context_frontier_chars_added"),
                  })
              results = list(task_dir.rglob("result.json"))
              if not results:
                  missing.append(task_dir.name)
                  trajectories = list(task_dir.rglob("miniswe_trajectory.json"))
                  if trajectories:
                      deep_tasks[task_name] = extract_trajectory(
                          trajectories[0],
                          task=task_name,
                          reward=None,
                          receipt_path=receipt_paths[0] if receipt_paths else None,
                      )
                  continue
              got = []
              for rp in results:
                  r = json.loads(rp.read_text(encoding="utf-8"))
                  # Single-task runs emit per-trial result.json (has
                  # verifier_result/task_name) plus a job-level one (only stats,
                  # no trial data). Count the per-trial files, skip job-level.
                  if not r.get("verifier_result") and not r.get("task_name"):
                      continue
                  got.append(r)
              trials.extend(got)
              per_task.append((task_dir.name, len(got)))
              trajectories = list(task_dir.rglob("miniswe_trajectory.json"))
              if trajectories:
                  reward = 1 if got and any(solved(item) for item in got) else 0 if got else None
                  deep_tasks[task_name] = extract_trajectory(
                      trajectories[0],
                      task=task_name,
                      reward=reward,
                      receipt_path=receipt_paths[0] if receipt_paths else None,
                      harbor_result=got[0] if got else None,
                  )

          graded = [t for t in trials if (t.get("verifier_result") or {}).get("rewards")]
          errored = [t for t in trials if t.get("exception_info")]
          n_solved = sum(1 for t in graded if solved(t))
          n_expected = len(expected) if expected else 0
          invalid_intelligence = [
              row["task"]
              for row in receipt_metrics
              if row["repository_intelligence_required"]
              and not row["repository_intelligence_denominator_excluded"]
              and (
                  row["repository_intelligence_status"] != "passed"
                  or row["repository_graph_degraded_fallback"]
                  or row["repository_intelligence_failures"]
              )
          ]

          out = ["# TB2 miniswe central matrix (GT-on)", ""]
          out.append("- arm: **${{ inputs.arm }}**")
          out.append("- feature: **${{ inputs.feature }}**")
          if missing:
              out.append(f"> **INCOMPLETE**: {len(missing)} task(s) produced no "
                         f"result.json: {', '.join(missing)}. The score below covers "
                         "only tasks that reported.")
              out.append("")
          out += [
              f"- tasks planned: **{n_expected}**",
              f"- trials returned: **{len(trials)}**",
              f"- graded (verifier produced rewards): **{len(graded)}**",
              f"- errored (exception, not graded): **{len(errored)}**",
          ]
          if graded:
              out.append(f"- **solved: {n_solved}/{len(graded)} "
                         f"({100 * n_solved / len(graded):.1f}% of graded)**")
          if n_expected:
              out.append(f"- **solved of planned: {n_solved}/{n_expected} "
                         f"({100 * n_solved / n_expected:.1f}%)**")
          if invalid_intelligence:
              out.append(
                  f"> **INVALID GT TREATMENT**: repository intelligence failed for "
                  f"{len(invalid_intelligence)} task(s): {', '.join(invalid_intelligence)}."
              )
          out += ["", "| task | solved | rewards / error |", "|---|---|---|"]
          for t in sorted(trials, key=lambda x: x.get("task_name") or ""):
              name = (t.get("task_name") or t.get("trial_name", "?")).split("__")[0]
              rewards = (t.get("verifier_result") or {}).get("rewards")
              exc = (t.get("exception_info") or {}).get("exception_type")
              mark = "yes" if rewards and solved(t) else ("no" if rewards else "-")
              out.append(f"| {name} | {mark} | {json.dumps(rewards) if rewards else (exc or 'no reward')} |")

          out += [
              "", "## Central runtime metrics", "",
              "| task | total tokens | uncached input | calls | model actions | effective task execs | controller execs | cached reads | checks | changes | failed | repeated | guidance delivered/candidates/suppressed | frontier deliveries/chars | graph nodes/edges | mirror/index ms | intelligence | censored |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|---:|",
          ]
          for row in sorted(receipt_metrics, key=lambda x: x["task"]):
              out.append(
                  f"| {row['task']} | {row['total_tokens'] or '-'} | "
                  f"{row['uncached_input_tokens'] or '-'} | {row['api_calls'] or '-'} | "
                  f"{row['actions'] or '-'} | {row['effective_task_actions'] or '-'} | "
                  f"{row['controller_environment_execs'] or 0} | "
                  f"{row['controller_cached_reads'] or 0} | {row['check_actions'] or 0} | "
                  f"{row['workspace_change_actions'] or 0} | {row['failed_actions'] or 0} | "
                  f"{row['repeated_commands'] or 0} | {row['guidance_events'] or 0}/"
                  f"{row['guidance_candidates'] or 0}/{row['guidance_suppressed'] or 0} | "
                  f"{row['context_frontier_deliveries'] or 0}/"
                  f"{row['context_frontier_chars_added'] or 0} | "
                  f"{row['repository_graph_nodes'] or 0}/"
                  f"{row['repository_graph_edges'] or 0} | "
                  f"{row['repository_mirror_transfer_ms'] or 0}/"
                  f"{row['repository_index_refresh_ms'] or 0} | "
                  f"{row['repository_intelligence_status'] or 'unreported'} | "
                  f"{row['censored'] or False} |"
              )

          Path("merged.json").write_text(json.dumps({
              "expected_tasks": n_expected,
              "missing_tasks": missing,
              "n_trials": len(trials),
              "n_graded": len(graded),
              "n_errored": len(errored),
              "n_solved": n_solved,
              "invalid_repository_intelligence_tasks": invalid_intelligence,
              "trial_results": trials,
              "receipt_metrics": receipt_metrics,
          }, indent=2), encoding="utf-8")
          Path("deep_metrics_${{ inputs.arm }}.json").write_text(json.dumps({
              "schema": "central-deep-metrics-v2",
              "arm": "${{ inputs.arm }}",
              "run_id": "${{ github.run_id }}",
              "tasks": deep_tasks,
          }, indent=2), encoding="utf-8")

          body = "\n".join(out) + "\n"
          Path("SUMMARY.md").write_text(body, encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(body)
          print(body[:4000])
          if invalid_intelligence:
              sys.exit(2)
          EOF

      - name: Upload merged result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-central-${{ inputs.arm }}-${{ inputs.feature }}-${{ github.run_id }}-MERGED
          path: |
            merged.json
            SUMMARY.md
            deep_metrics_*.json
          if-no-files-found: warn
