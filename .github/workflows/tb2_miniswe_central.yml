# Terminal-Bench 2.0 MINI-SWE CENTRAL RUNTIME matrix, one job per task.
#
# Uses the already-frozen 2026-07-31 baseline only as a post-hoc comparator and
# runs the host-owned GT treatment control plane
# (eval.gt_central_agent:MiniSweCentralAgent). Private runtime
# code, state, provider credentials, and feature configuration stay on the
# Harbor host; only literal model-selected Bash commands enter the task image.
#
# Promotion-capable runs use one immutable task profile from the frozen
# baseline. Arbitrary subsets are diagnostic-only and cannot emit a verdict.
# --agent-timeout-multiplier 1.0. This workflow has no baseline-generation arm.
name: TB2 miniswe central matrix (GT-on)

on:
  workflow_dispatch:
    inputs:
      comparison_profile:
        description: "Frozen comparison denominator"
        type: choice
        options: [repair20-v1]
        default: repair20-v1
      parallel:
        description: "Max concurrent task jobs (GHA concurrency cap)"
        type: string
        default: "10"
      ref:
        description: "Exact treatment commit or branch; blank freezes the dispatch commit"
        type: string
        default: ""
      provider_preflight_timeout_sec:
        description: "Provider preflight timeout for this run; increase for queued TokenRouter routes"
        type: string
        default: "600"

permissions:
  contents: read
  actions: read
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
      - id: freeze
        name: Freeze exact treatment commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  provider_free:
    needs: resolve
    uses: ./.github/workflows/central_provider_free.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  release_identity:
    needs: [resolve, provider_free]
    runs-on: ubuntu-latest
    outputs:
      prediction_sha256: ${{ steps.prediction.outputs.prediction_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce active release authorization
        run: |
          python -m scripts.release_workflow_guard \
            --workflow tb2_miniswe_central.yml \
            --current-sha "$(git rev-parse HEAD)"
      - name: Verify exact provider-free certification identity
        env:
          EXPECTED_COMMIT: ${{ needs.resolve.outputs.sha }}
          CERTIFIED_COMMIT: ${{ needs.provider_free.outputs.certified_commit }}
          MECHANICAL_STATUS: ${{ needs.provider_free.outputs.mechanical_status }}
        run: |
          test "$CERTIFIED_COMMIT" = "$EXPECTED_COMMIT"
          test "$MECHANICAL_STATUS" = "PASS"
      - id: prediction
        name: Verify canonical release identity before provider spend
        env:
          COMPARISON_PROFILE: ${{ inputs.comparison_profile }}
        run: |
          set -euo pipefail
          python scripts/verify_frozen_outcome_prediction.py \
            --release-manifest eval/release/active_release.json \
            --profile "$COMPARISON_PROFILE" \
            --current-commit "$(git rev-parse HEAD)" \
            --output outcome-prediction-proof.json \
            | tee outcome-prediction-proof.stdout.json
          prediction_sha256=$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path("outcome-prediction-proof.json").read_text())["prediction_sha256"])
          PY
          )
          echo "prediction_sha256=$prediction_sha256" >> "$GITHUB_OUTPUT"
          cat outcome-prediction-proof.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload frozen prediction proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-outcome-prediction-proof-${{ github.run_id }}
          path: |
            outcome-prediction-proof.json
            outcome-prediction-proof.stdout.json

  plan:
    needs: [resolve, provider_free, release_identity]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tasks: ${{ steps.enum.outputs.tasks }}
      task_set_sha256: ${{ steps.enum.outputs.task_set_sha256 }}
      prediction_sha256: ${{ needs.release_identity.outputs.prediction_sha256 }}
      canary_model: ${{ steps.canary_identity.outputs.model }}
      canary_provider: ${{ steps.canary_identity.outputs.provider }}
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      GT_INDEX_BINARY: ${{ github.workspace }}/vendor/gt-index-linux-amd64
      SNOWFLAKE_MODEL_REVISION: 7802add0519e4bf94c46ef23552176697c7a1ac7
      SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
      SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
      GT_DENSE_INTRA_OP_THREADS: "4"
      GT_DENSE_INTER_OP_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          # The frozen prediction verifier proves that the runtime proof
          # commit is an ancestor of this exact treatment commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: route
        name: Resolve frozen provider route from release identity
        run: |
          python -m scripts.provider_route_contract \
            --release-manifest eval/release/active_release.json \
            --github-output "$GITHUB_OUTPUT" \
            --json-output provider-route-contract.json
      - name: Bind only the frozen route credential
        env:
          GT_SELECTED_PROVIDER_CREDENTIAL: ${{ secrets[steps.route.outputs.credential_secret_name] }}
        run: |
          python -m scripts.provider_route_contract \
            --release-manifest eval/release/active_release.json \
            --github-env "$GITHUB_ENV" \
            --bind-credential
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index from the checked-out source
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          chmod +x vendor/gt-index-linux-amd64
          python -m pip install -e '.[retrieval]' "mini-swe-agent==2.4.6" "harbor==0.20.0" \
            vendor/groundtruth_mcp-*.whl

      - name: Provision pinned Snowflake ONNX runtime asset
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" | sha256sum -c -

      - name: Prove repository intelligence substrate
        run: python scripts/verify_gt_index_runtime.py

      - name: Prove pinned language contract
        run: python scripts/verify_tb2_language_contract.py

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned, notes = [], []
          for name in ("OPENAI_API_KEY", "DEEPSEEK_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if clean != raw:
                  notes.append(f"{name}: removed {len(raw) - len(clean)} stray char(s)")
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping "
                        "BOM/whitespace - it cannot be sent as an HTTP header")
                  sys.exit(1)
              cleaned.append((name, clean))

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          for n in notes:
              print(f"::warning::{n}")
          EOF

      - name: Prove exact persistent bootstrap provider contract (gates all jobs)
        env:
          MODEL: ${{ steps.route.outputs.request_model }}
          PROVIDER_PREFLIGHT_TIMEOUT_SEC: ${{ inputs.provider_preflight_timeout_sec }}
        run: |
          set -euo pipefail
          # This is the exact runtime bootstrap path: one forced select_catalog
          # tool selection, the production parser, request hashes, provider identity,
          # and no executor action. A generic text completion cannot certify it.
          timeout --signal=TERM "${PROVIDER_PREFLIGHT_TIMEOUT_SEC}s" \
            python -m scripts.central_bootstrap_canary \
              --model "$MODEL" \
              --timeout-sec "$PROVIDER_PREFLIGHT_TIMEOUT_SEC" \
              --output bootstrap-canary.json

      - id: canary_identity
        name: Export observed bootstrap canary identity
        run: |
          python - <<'EOF'
          import json, os
          from pathlib import Path

          payload = json.loads(Path("bootstrap-canary.json").read_text(encoding="utf-8"))
          identity = ((payload.get("receipt") or {}).get("response_identity") or {})
          model = str(identity.get("model") or "")
          provider = str(identity.get("provider") or "")
          if (
              model != os.environ["GT_EXPECTED_RESPONSE_MODEL"]
              or provider != os.environ["GT_EXPECTED_ADAPTER_PROVIDER"]
          ):
              raise SystemExit("::error::bootstrap canary observed identity mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"model={model}\nprovider={provider}\n")
          EOF

      - name: Upload exact bootstrap proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-canary-${{ github.run_id }}
          path: |
            bootstrap-canary.json
            provider-route-contract.json
          if-no-files-found: error

      - name: Enumerate dataset tasks
        id: enum
        env:
          DATASET: terminal-bench@2.0
          COMPARISON_PROFILE: ${{ inputs.comparison_profile }}
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o ds --export
          python - <<'EOF'
          import json, os
          from pathlib import Path

          from scripts.release_manifest import load_release_manifest
          from scripts.tb2_promotion_gate import task_set_sha256

          dataset = os.environ["DATASET"]
          root = Path("ds") / dataset.split("@", 1)[0]
          available = {p.name for p in root.iterdir() if p.is_dir()}
          if not available:
              raise SystemExit(f"::error::no tasks found under {root}")

          baseline = json.loads(
              load_release_manifest().baseline_path.read_text(encoding="utf-8")
          )
          profile_id = os.environ["COMPARISON_PROFILE"]
          profile = baseline["manifest"]["profiles"][profile_id]
          tasks = sorted(
              row["task"] for row in baseline["rows"]
          ) if profile.get("task_source") == "all_rows" else sorted(profile["task_ids"])
          missing = sorted(set(tasks) - available)
          if missing:
              raise SystemExit(f"::error::profile tasks absent from dataset: {missing}")
          digest = task_set_sha256(tasks)
          if len(tasks) != profile["task_count"] or digest != profile["task_set_sha256"]:
              raise SystemExit("::error::frozen comparison profile failed count/hash validation")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tasks={json.dumps(tasks)}\n")
              f.write(f"task_set_sha256={digest}\n")

          summary = [f"## Plan: {len(tasks)} tasks as individual jobs", ""]
          summary.append("`" + ", ".join(tasks) + "`")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(summary) + "\n")
          print("\n".join(summary))
          EOF

  task_progress:
    name: Task progress
    needs: [plan]
    if: always()
    uses: ./.github/workflows/task_progress.yml
    with:
      expected_tasks_json: ${{ needs.plan.outputs.tasks }}
      task_job_regex: '^run \(.+\)$'
    secrets: inherit

  run:
    needs: [resolve, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.parallel) }}
      matrix:
        task: ${{ fromJson(needs.plan.outputs.tasks) }}
    env:
      PYTHONUTF8: "1"
      # gh release download uses GH_TOKEN in task jobs; without it a parallel
      # task can fail before model execution with a misleading 401, leaving
      # the denominator incomplete despite a valid pinned asset.
      GH_TOKEN: ${{ github.token }}
      GT_INDEX_BINARY: ${{ github.workspace }}/vendor/gt-index-linux-amd64
      SNOWFLAKE_MODEL_REVISION: 7802add0519e4bf94c46ef23552176697c7a1ac7
      SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
      SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
      GT_DENSE_INTRA_OP_THREADS: "4"
      GT_DENSE_INTER_OP_THREADS: "1"
      MSWEA_SILENT_STARTUP: "1"
      TASKS_JSON: ${{ needs.plan.outputs.tasks }}
      TASK_SET_SHA256: ${{ needs.plan.outputs.task_set_sha256 }}
      PREDICTION_SHA256: ${{ needs.plan.outputs.prediction_sha256 }}
      GT_COMMIT: ${{ needs.resolve.outputs.sha }}
      CANARY_MODEL: ${{ needs.plan.outputs.canary_model }}
      # Provider credentials remain on the Harbor host. The external agent
      # passes an empty env mapping to every model-selected task command.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: route
        name: Resolve frozen provider route from release identity
        run: |
          python -m scripts.provider_route_contract \
            --release-manifest eval/release/active_release.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Bind only the frozen route credential
        env:
          GT_SELECTED_PROVIDER_CREDENTIAL: ${{ secrets[steps.route.outputs.credential_secret_name] }}
        run: |
          python -m scripts.provider_route_contract \
            --release-manifest eval/release/active_release.json \
            --github-env "$GITHUB_ENV" \
            --bind-credential
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index from the checked-out source
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af

      - name: Ensure Docker daemon is available for containerized tasks
        run: |
          set -euo pipefail
          sudo systemctl start docker
          docker info >/dev/null

      - name: Install nano-harness + harbor
        run: |
          python -m pip install --upgrade pip
          chmod +x vendor/gt-index-linux-amd64
          python -m pip install -e '.[retrieval]' "mini-swe-agent==2.4.6" "harbor==0.20.0" \
            vendor/groundtruth_mcp-*.whl

      - name: Provision pinned Snowflake ONNX runtime asset in task job
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" | sha256sum -c -
          MODEL_DIR="$model_dir" python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["MODEL_DIR"])
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = {
              "model": "Snowflake/snowflake-arctic-embed-m",
              "revision": os.environ["SNOWFLAKE_MODEL_REVISION"],
              "model_sha256": os.environ["SNOWFLAKE_MODEL_SHA256"],
              "tokenizer_sha256": os.environ["SNOWFLAKE_TOKENIZER_SHA256"],
          }
          for key, value in expected.items():
              if str(manifest.get(key) or "") != value:
                  raise SystemExit(f"manifest mismatch for {key}: {manifest.get(key)!r}")
          if manifest.get("inference_api") is not False:
              raise SystemExit("pinned asset manifest must prove inference_api=false")
          PY

      - name: Verify pinned dense backend before Mini-SWE
        run: |
          set -euo pipefail
          MODEL_DIR="$RUNNER_TEMP/snowflake-arctic-embed-m" python - <<'PY'
          import json, os
          from pathlib import Path

          from gt_engine.snowflake_onnx import SnowflakeOnnxDenseBackend

          root = Path(os.environ["MODEL_DIR"])
          backend = SnowflakeOnnxDenseBackend.from_directory(root)
          query = backend.embed_query("verify the repository implementation")
          passage = backend.embed_documents(("def verify_repository(): pass",))[0]
          if not query or not passage:
              raise SystemExit("Snowflake backend returned an empty embedding")
          receipt = backend.receipt()
          if receipt.get("network_calls") or receipt.get("provider_calls"):
              raise SystemExit("dense backend made a network/provider call")
          proof = {
              "schema": "gt.snowflake_dense_backend_proof.v1",
              "available": True,
              "identity": backend.identity,
              "model_revision": os.environ["SNOWFLAKE_MODEL_REVISION"],
              "model_sha256": os.environ["SNOWFLAKE_MODEL_SHA256"],
              "tokenizer_sha256": os.environ["SNOWFLAKE_TOKENIZER_SHA256"],
              "receipt": receipt,
              "query_dimensions": len(query),
              "passage_dimensions": len(passage),
          }
          Path("dense-backend-proof.json").write_text(
              json.dumps(proof, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(proof, sort_keys=True))
          PY

      - name: Prove repository intelligence substrate
        run: python scripts/verify_gt_index_runtime.py

      - name: Prove pinned language contract
        run: python scripts/verify_tb2_language_contract.py

      - name: Sanitize API keys (strip BOM / stray whitespace)
        run: |
          python - <<'EOF'
          import os, sys

          cleaned = []
          for name in ("OPENAI_API_KEY", "DEEPSEEK_API_KEY", "ANTHROPIC_API_KEY"):
              raw = os.environ.get(name) or ""
              if not raw:
                  continue
              clean = raw.replace("\ufeff", "").strip()
              if not clean.isascii():
                  print(f"::error::{name} holds non-ASCII characters after stripping")
                  sys.exit(1)
              cleaned.append((name, clean))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              for name, clean in cleaned:
                  print(f"::add-mask::{clean}")
                  f.write(f"{name}={clean}\n")
          EOF

      - name: Restore task image from cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ matrix.task }}-20251031

      - name: Load cached task image
        if: steps.restore.outputs.cache-hit == 'true'
        run: |
          docker load -i "${{ runner.temp }}/tb2-img.tar.gz"
          echo "loaded task image from cache for ${{ matrix.task }}"

      - name: Resolve Harbor's exact task-owned agent budget
        env:
          DATASET: terminal-bench@2.0
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          harbor dataset download "$DATASET" -o ds --export
          mkdir -p results/terminal-bench
          EXECUTION_BUDGET=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.resolve_harbor_budget import resolve_budget

          tasks = json.loads(os.environ["TASKS_JSON"])
          selected = os.environ["TASK"]
          rows = {}
          for task in tasks:
              receipt = resolve_budget(
                  Path("ds/terminal-bench") / task / "task.toml",
                  multiplier=1.0,
              )
              rows[task] = {
                  "task_config_sha256": receipt["task_config_sha256"],
                  "base_timeout_sec": receipt["base_timeout_sec"],
                  "timeout_multiplier": receipt["timeout_multiplier"],
                  "execution_budget_sec": receipt["execution_budget_sec"],
              }
          policy = {
              "schema": "gt.tb2.timeout_policy.v1",
              "resolver": "scripts.resolve_harbor_budget:resolve_budget",
              "resolved_task_budgets": rows,
              "agent_timeout_multiplier": 1.0,
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "gt-timeout-policy.json"
          output.write_text(
              json.dumps(policy, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          budget_output = (
              Path("results/terminal-bench") / f"harbor-budget-{selected}.json"
          )
          budget_output.write_text(
              json.dumps(rows[selected], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(rows[selected]["execution_budget_sec"])
          PY
          )
          echo "EXECUTION_BUDGET=${EXECUTION_BUDGET}" >> "$GITHUB_ENV"
          echo "GT_TIMEOUT_POLICY_PATH=$RUNNER_TEMP/gt-timeout-policy.json" >> "$GITHUB_ENV"
          echo "resolved Harbor agent budget: ${EXECUTION_BUDGET}s"

      - name: Capture source-owned runtime observation
        env:
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import inspect
          import json
          import os
          from pathlib import Path

          from eval.gt_central_agent import MiniSweCentralAgent

          def canonical(value):
              return json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")

          def digest(value):
              return hashlib.sha256(canonical(value)).hexdigest()

          tasks = json.loads(os.environ["TASKS_JSON"])
          if not isinstance(tasks, list) or not tasks or not all(
              isinstance(task, str) and task for task in tasks
          ):
              raise SystemExit("task plan is not a non-empty ordered string list")
          task_set_sha = os.environ["TASK_SET_SHA256"]
          if len(task_set_sha) != 64:
              raise SystemExit("task plan hash is not a SHA-256")

          temperature = inspect.signature(MiniSweCentralAgent.__init__).parameters[
              "temperature"
          ].default
          dense_proof = json.loads(
              Path("dense-backend-proof.json").read_text(encoding="utf-8")
          )
          timeout_policy = json.loads(
              Path(os.environ["GT_TIMEOUT_POLICY_PATH"]).read_text(encoding="utf-8")
          )
          if dense_proof.get("available") is not True:
              raise SystemExit("dense backend proof is not available")

          source_root = (
              Path(os.environ["RUNNER_TEMP"])
              / "gt-runtime-sources"
              / os.environ["TASK"]
          )
          source_root.mkdir(parents=True, exist_ok=True)
          sources = {
              "dispatch_manifest": {
                  "task_count": len(tasks),
                  "task_order_sha256": task_set_sha,
              },
              "provider_request": {
                  "provider_identity": os.environ["CANARY_MODEL"],
                  "temperature": float(temperature),
                  "sampling_parameters": {
                      "temperature": float(temperature),
                      "num_retries": 0,
                  },
              },
              "serialized_runtime_envelope": {
                  "tool_envelope_sha256": digest({
                      "agent_import_path": "eval.gt_central_agent:MiniSweCentralAgent",
                      "tool_contract": "miniswe_bash_command_v1",
                      "runner": "harbor",
                  }),
                  "hook_envelope_sha256": digest({
                      "host_owned": True,
                      "preflight_mode": "assistive_safe",
                      "task_start_advisory": False,
                      "source_observation_boundary": "pre-provider-agent-construction",
                  }),
              },
              "loaded_asset_receipt": {
                  "embedding_configuration_sha256": digest(dense_proof),
              },
               "runner_environment": {
                   "hardware_assumptions_sha256": digest({
                       "runner_os": os.environ.get("RUNNER_OS", ""),
                       "runner_arch": os.environ.get("RUNNER_ARCH", ""),
                   }),
               },
               "runtime_policy": {
                  "retry_policy_sha256": digest({
                      "executor_retry_policy": "provider_once_no_retry",
                      "provider_retries": 0,
                  }),
                   "timeout_policy_sha256": digest(timeout_policy),
               },
              "metering_adapter": {
                  "token_accounting_sha256": digest({
                      "cost_tracking": os.environ.get(
                          "MSWEA_COST_TRACKING", "ignore_errors"
                      ),
                      "receipt_fields": [
                          "input_tokens",
                          "output_tokens",
                          "total_tokens",
                          "provider_calls",
                          "provider_cost_usd",
                      ],
                  }),
              },
          }
          for name, payload in sources.items():
              (source_root / f"{name}.json").write_text(
                  json.dumps(payload, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          PY
          python -m scripts.build_runtime_observation \
            --dispatch-manifest "$RUNNER_TEMP/gt-runtime-sources/$TASK/dispatch_manifest.json" \
            --provider-request "$RUNNER_TEMP/gt-runtime-sources/$TASK/provider_request.json" \
            --serialized-runtime-envelope "$RUNNER_TEMP/gt-runtime-sources/$TASK/serialized_runtime_envelope.json" \
            --loaded-asset-receipt "$RUNNER_TEMP/gt-runtime-sources/$TASK/loaded_asset_receipt.json" \
            --runner-environment "$RUNNER_TEMP/gt-runtime-sources/$TASK/runner_environment.json" \
            --runtime-policy "$RUNNER_TEMP/gt-runtime-sources/$TASK/runtime_policy.json" \
            --metering-adapter "$RUNNER_TEMP/gt-runtime-sources/$TASK/metering_adapter.json" \
            --output "$RUNNER_TEMP/gt-runtime-sources/$TASK/runtime-observation.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          observation = json.loads(
              (
                  Path(os.environ["RUNNER_TEMP"])
                  / "gt-runtime-sources"
                  / os.environ["TASK"]
                  / "runtime-observation.json"
              ).read_text(encoding="utf-8")
          )
          if observation.get("schema") != "gt.benchmark_runtime_execution_observation.v1":
              raise SystemExit("runtime observation is not complete")
          if len(observation.get("field_sources") or {}) != 12:
              raise SystemExit("runtime observation does not cover every required field")
          PY
          echo "GT_RUNTIME_OBSERVATION_PATH=$RUNNER_TEMP/gt-runtime-sources/$TASK/runtime-observation.json" >> "$GITHUB_ENV"

      - name: Build caller-owned benchmark identity
        env:
          COMPARISON_PROFILE: ${{ inputs.comparison_profile }}
          DATASET: terminal-bench@2.0
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          IDENTITY_ROOT="$RUNNER_TEMP/gt-benchmark-identity/$TASK"
          mkdir -p "$IDENTITY_ROOT"
          STEP_LIMIT=$(python - <<'PY'
          import json
          from pathlib import Path

          from scripts.release_manifest import load_release_manifest

          baseline = json.loads(
              load_release_manifest().baseline_path.read_text(encoding="utf-8")
          )
          print(int(baseline["manifest"]["model_identity"]["step_limit"]))
          PY
          )
          IDENTITY_ROOT="$IDENTITY_ROOT" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from scripts.release_manifest import load_release_manifest

          def digest(value):
              encoded = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          root = Path(os.environ["IDENTITY_ROOT"])
          tasks = json.loads(os.environ["TASKS_JSON"])
          (root / "tasks.json").write_text(
              json.dumps(tasks, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          baseline = json.loads(
              load_release_manifest().baseline_path.read_text(encoding="utf-8")
          )
          temperature = float(baseline["manifest"]["model_identity"]["temperature"])
          dense_proof = json.loads(
              Path("dense-backend-proof.json").read_text(encoding="utf-8")
          )
          timeout_policy = json.loads(
              Path(os.environ["GT_TIMEOUT_POLICY_PATH"]).read_text(encoding="utf-8")
          )
          execution_contract = {
              "task_count": len(tasks),
              "task_order_sha256": os.environ["TASK_SET_SHA256"],
              "provider_identity": os.environ["CANARY_MODEL"],
              "temperature": temperature,
              "sampling_parameters": {
                  "temperature": temperature,
                  "num_retries": 0,
              },
              "tool_envelope_sha256": digest({
                  "agent_import_path": "eval.gt_central_agent:MiniSweCentralAgent",
                  "tool_contract": "miniswe_bash_command_v1",
                  "runner": "harbor",
              }),
              "hook_envelope_sha256": digest({
                  "host_owned": True,
                  "preflight_mode": "assistive_safe",
                  "task_start_advisory": False,
                  "source_observation_boundary": "pre-provider-agent-construction",
              }),
              "embedding_configuration_sha256": digest(dense_proof),
              "hardware_assumptions_sha256": digest({
                  "runner_os": os.environ.get("RUNNER_OS", ""),
                  "runner_arch": os.environ.get("RUNNER_ARCH", ""),
              }),
              "retry_policy_sha256": digest({
                  "executor_retry_policy": "provider_once_no_retry",
                  "provider_retries": 0,
              }),
              "timeout_policy_sha256": digest(timeout_policy),
              "token_accounting_sha256": digest({
                  "cost_tracking": os.environ.get(
                      "MSWEA_COST_TRACKING", "ignore_errors"
                  ),
                  "receipt_fields": [
                      "input_tokens",
                      "output_tokens",
                      "total_tokens",
                      "provider_calls",
                      "provider_cost_usd",
                  ],
              }),
          }
          (root / "execution-contract.json").write_text(
              json.dumps(
                  execution_contract, indent=2, sort_keys=True
              ) + "\n",
              encoding="utf-8",
          )
          descriptor = json.loads(
              load_release_manifest().treatment_path.read_text(encoding="utf-8")
          )
          descriptor.pop("runtime_agent_kwargs", None)
          descriptor["source_sha"] = os.environ["GT_COMMIT"]
          (root / "treatments.json").write_text(
              json.dumps([descriptor], indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          python -m scripts.build_benchmark_manifest \
            --benchmark-id "${DATASET}/${COMPARISON_PROFILE}" \
            --task-manifest "$IDENTITY_ROOT/tasks.json" \
            --model-id "$CANARY_MODEL" \
            --scaffold-sha "$GT_COMMIT" \
            --treatments "$IDENTITY_ROOT/treatments.json" \
            --execution-contract "$IDENTITY_ROOT/execution-contract.json" \
            --max-steps "$STEP_LIMIT" \
            --trials-per-task 1 \
            --output "$IDENTITY_ROOT/benchmark-manifest.json"
          echo "GT_STEP_LIMIT=$STEP_LIMIT" >> "$GITHUB_ENV"
          echo "GT_BENCHMARK_MANIFEST_PATH=$IDENTITY_ROOT/benchmark-manifest.json" >> "$GITHUB_ENV"

      - name: Run harbor - task ${{ matrix.task }}
        id: harbor
        env:
          MODEL: ${{ needs.plan.outputs.canary_model }}
          DATASET: terminal-bench@2.0
          TASK: ${{ matrix.task }}
        run: |
          set -euo pipefail
          AGENT="eval.gt_central_agent:MiniSweCentralAgent"
          TREATMENT_CONTRACT="$RUNNER_TEMP/gt-treatment-runtime.json"
          python -m scripts.render_treatment_agent_args \
            --release-manifest eval/release/active_release.json \
            --source-sha "$GT_COMMIT" \
            --max-steps "$GT_STEP_LIMIT" \
            --benchmark-manifest "$GT_BENCHMARK_MANIFEST_PATH" \
            --output "$TREATMENT_CONTRACT"
          mapfile -t FEATURE_ARGS < <(
            python -m scripts.render_treatment_agent_args \
              --emit-harbor-args "$TREATMENT_CONTRACT"
          )
          FEATURE_ARGS+=(
            --ak execution_budget_sec="$EXECUTION_BUDGET"
            --ak preemptive_retrieval_model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
            --ak enable_replay_capture="true"
            --ak treatment_runtime_contract_path="$TREATMENT_CONTRACT"
          )
          cp "$TREATMENT_CONTRACT" gt-treatment-runtime.json
          JOB_NAME="tb2-miniswe-central-certified_full-integrated-${GITHUB_RUN_ID}-${TASK}"
          echo "job_name=${JOB_NAME}" >> "$GITHUB_OUTPUT"

          harbor run \
            -d "$DATASET" \
            --agent-import-path "$AGENT" \
            -m "$MODEL" \
            -o results/terminal-bench \
            --job-name "$JOB_NAME" \
            --agent-timeout-multiplier 1.0 \
            -n 1 \
            -y \
            "${FEATURE_ARGS[@]}" \
            -i "$TASK"

      - name: Preserve runtime observation artifact
        if: always()
        run: |
          if [ -n "${GT_RUNTIME_OBSERVATION_PATH:-}" ] && [ -f "$GT_RUNTIME_OBSERVATION_PATH" ]; then
            cp "$GT_RUNTIME_OBSERVATION_PATH" runtime-observation.json
          fi
          if [ -n "${GT_BENCHMARK_MANIFEST_PATH:-}" ] && [ -f "$GT_BENCHMARK_MANIFEST_PATH" ]; then
            cp "$GT_BENCHMARK_MANIFEST_PATH" benchmark-manifest.json
          fi

      - name: Cache task image for future runs
        if: steps.restore.outputs.cache-hit != 'true'
        id: saveimg
        env:
          TASK: ${{ matrix.task }}
          IMAGE_TAG: "20251031"
        run: |
          IMG="alexgshaw/${TASK}:${IMAGE_TAG}"
          set +e
          SIZE=$(docker image inspect --format '{{.Size}}' "$IMG" 2>/dev/null)
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "image $IMG not present; nothing to cache"
            exit 0
          fi
          if [ "$SIZE" -gt 1500000000 ]; then
            echo "image ${TASK} is $SIZE bytes (>1.5GB); skipping cache to protect the budget"
            exit 0
          fi
          docker save "$IMG" | gzip -1 > "${{ runner.temp }}/tb2-img.tar.gz"
          echo "cached=1" >> "$GITHUB_OUTPUT"
          echo "saved ${TASK} image ($SIZE bytes) for future runs"

      - name: Upload task image cache
        if: steps.restore.outputs.cache-hit != 'true' && steps.saveimg.outputs.cached == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/tb2-img.tar.gz
          key: tb2-img-${{ matrix.task }}-20251031

      - name: Fix artifact permissions
        if: always()
        run: |
          # Some task verifiers still return root-owned result artifacts.
          sudo find results -type f -exec chmod a+r {} + 2>/dev/null || \
            sudo chmod -R a+r results || true

      - name: Disk after run
        if: always()
        run: df -h /

      - name: Upload task result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-central-certified_full-integrated-${{ github.run_id }}-task-${{ matrix.task }}
          path: |
            results/terminal-bench/
            dense-backend-proof.json
            runtime-observation.json
            benchmark-manifest.json
            gt-treatment-runtime.json
          if-no-files-found: warn

  merge:
    needs: [resolve, provider_free, plan, run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download all task artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tb2-miniswe-central-certified_full-integrated-${{ github.run_id }}-task-*
          path: tasks
          merge-multiple: false

      - name: Download exact provider-free proof
        uses: actions/download-artifact@v4
        with:
          pattern: central-provider-free-${{ github.run_id }}
          path: provider-free
          merge-multiple: true

      - name: Download exact bootstrap route proof
        uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-canary-${{ github.run_id }}
          path: bootstrap-canary
          merge-multiple: true

      - name: Merge task results
        env:
          EXPECTED_TASKS_JSON: ${{ needs.plan.outputs.tasks }}
          TASK_SET_SHA256: ${{ needs.plan.outputs.task_set_sha256 }}
          COMPARISON_PROFILE: ${{ inputs.comparison_profile }}
          CANARY_MODEL: ${{ needs.plan.outputs.canary_model }}
          CANARY_PROVIDER: ${{ needs.plan.outputs.canary_provider }}
          PREDICTION_SHA256: ${{ needs.plan.outputs.prediction_sha256 }}
          GT_COMMIT: ${{ needs.resolve.outputs.sha }}
          GT_RUN_ID: ${{ github.run_id }}
          PROVIDER_FREE_COMMIT: ${{ needs.provider_free.outputs.certified_commit }}
          PROVIDER_FREE_STATUS: ${{ needs.provider_free.outputs.mechanical_status }}
        # The merge implementation lives in scripts/tb2_merge_results.py to
        # stay below GitHub's expression-size limit. These anchors keep the
        # fail-closed release contract reviewable at the dispatch surface:
        # invalid_intelligence = [; out = [; harbor_result=got[0] if got else None
        # audit_treatment_runtime; build_feature_lifecycle_report;
        # assess_tb2_promotion; invalid_treatment_release_tasks;
        # fingerprint drift does not excuse a baseline loss.
        # from gt_engine.delivery_audit import audit_provider_deliveries
        # dense_receipt.get("available") is True; dense_proof.get("available") is True
        # provider_delivery_failures; invalid_provider_deliveries;
        # invalid_intelligence or invalid_dense or invalid_provider_deliveries
        # INVALID GT TREATMENT; INVALID TREATMENT RELEASE; invalid_treatment_release;
        # not lifecycle_report["passed"]; not promotion_report.passed;
        # call1_gt_changed_tasks; This is intervention accounting.
        run: python scripts/tb2_merge_results.py

      - name: Upload merged result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tb2-miniswe-central-certified_full-integrated-${{ github.run_id }}-MERGED
          path: |
            merged.json
            SUMMARY.md
            deep_metrics_*.json
            feature_lifecycle_report.json
            tb2_treatment.json
            promotion_report.json
            regression_forensics.json
          if-no-files-found: warn
