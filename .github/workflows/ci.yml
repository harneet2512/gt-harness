name: GroundTruth evidence CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: har76-review-inbox
  cancel-in-progress: false

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    env:
      GROUNDTRUTH_ROOT: ${{ github.workspace }}/Groundtruth
      GIT_AUTHOR_NAME: GroundTruth CI
      GIT_AUTHOR_EMAIL: groundtruth-ci@example.invalid
      GIT_COMMITTER_NAME: GroundTruth CI
      GIT_COMMITTER_EMAIL: groundtruth-ci@example.invalid
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned Groundtruth parity source
        uses: actions/checkout@v4
        with:
          repository: harneet2512/groundtruth
          ref: f2863f8781edaeaef8787c515e36381cdbd692d5
          path: Groundtruth
      - uses: actions/setup-go@v5
        with:
          go-version-file: Groundtruth/gt-index/go.mod
          cache-dependency-path: Groundtruth/gt-index/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e ./Groundtruth -e ".[dev,miniswe,eval]" litellm
      - name: Build pinned provider-free producer and configure git identity
        working-directory: Groundtruth/gt-index
        env:
          CGO_ENABLED: "1"
        run: |
          git config --global user.name "$GIT_AUTHOR_NAME"
          git config --global user.email "$GIT_AUTHOR_EMAIL"
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$RUNNER_TEMP/gt-index" "$RUNNER_TEMP/bin/gt-index"
          chmod +x "$RUNNER_TEMP/gt-index" "$RUNNER_TEMP/bin/gt-index"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          git config --global core.hooksPath "$GITHUB_WORKSPACE/.githooks"
      - name: Run full pytest suite
        id: pytest
        continue-on-error: true
        run: python -m pytest -q
      - name: Emit CI outcome packet
        if: always()
        env:
          CONCLUSION: ${{ steps.pytest.outcome == 'success' && 'success' || 'failure' }}
        run: >-
          python scripts/ci_emit_review_packet.py
          --ticket HAR-76 --pr ${{ github.event.pull_request.number || 0 }}
          --head-sha ${{ github.event.pull_request.head.sha || github.sha }}
          --check ci-pytest --conclusion "$CONCLUSION"
          --variant py${{ matrix.python-version }}
          --run-id ${{ github.run_id }} --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --output ci-packets/ci-pytest-${{ github.run_id }}.json
      - name: Upload CI outcome packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-review-packets-${{ github.run_id }}-pytest-py${{ matrix.python-version }}
          path: ci-packets/ci-pytest-${{ github.run_id }}.json
          if-no-files-found: error
      - name: Fail on RED suite
        if: steps.pytest.outcome != 'success'
        run: exit 1

  feature-matrix:
    name: feature matrix verifier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -e ".[dev,miniswe,eval]" litellm vendor/groundtruth_mcp-*.whl
      - name: Verify 18x18 feature matrix
        id: matrix
        continue-on-error: true
        run: python scripts/verify_feature_matrix.py
      - name: Emit CI outcome packet
        if: always()
        env:
          CONCLUSION: ${{ steps.matrix.outcome == 'success' && 'success' || 'failure' }}
        run: >-
          python scripts/ci_emit_review_packet.py
          --ticket HAR-76 --pr ${{ github.event.pull_request.number || 0 }}
          --head-sha ${{ github.event.pull_request.head.sha || github.sha }}
          --check ci-feature-matrix --conclusion "$CONCLUSION"
          --run-id ${{ github.run_id }} --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --output ci-packets/ci-feature-matrix-${{ github.run_id }}.json
      - name: Upload CI outcome packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-review-packets-${{ github.run_id }}-feature-matrix
          path: ci-packets/ci-feature-matrix-${{ github.run_id }}.json
          if-no-files-found: error
      - name: Fail on RED matrix verification
        if: steps.matrix.outcome != 'success'
        run: exit 1

  commit-review-packets:
    name: commit CI packets to review inbox
    if: always()
    needs: [pytest, feature-matrix]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review inbox
        uses: actions/checkout@v4
        with:
          ref: gt-review-inbox
          fetch-depth: 1
          persist-credentials: true
      - name: Download pytest 3.12 packet
        uses: actions/download-artifact@v4
        with:
          name: ci-review-packets-${{ github.run_id }}-pytest-py3.12
          path: ci-artifacts/pytest-py3.12
      - name: Download pytest 3.13 packet
        uses: actions/download-artifact@v4
        with:
          name: ci-review-packets-${{ github.run_id }}-pytest-py3.13
          path: ci-artifacts/pytest-py3.13
      - name: Download feature-matrix packet
        uses: actions/download-artifact@v4
        with:
          name: ci-review-packets-${{ github.run_id }}-feature-matrix
          path: ci-artifacts/feature-matrix
      - name: Validate and install packets in inbox
        run: python scripts/ci_commit_review_packets.py ci-artifacts inbox
      - name: Commit and push inbox packets
        run: |
          git config user.name "GroundTruth CI"
          git config user.email "groundtruth-ci@example.invalid"
          git add inbox/
          if git diff --cached --quiet; then
            echo "No new CI packets to commit"
            exit 0
          fi
          git commit -m "inbox: CI outcomes for run ${{ github.run_id }}"
          git push origin HEAD:refs/heads/gt-review-inbox
