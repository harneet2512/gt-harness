      - name: Documentation consistency audit
        run: |
          python scripts/documentation_consistency_audit.py \
            --output documentation-consistency.json

      - id: mechanical_complete
        name: Authoritative mechanical-completeness gate
        run: |
          python scripts/mechanical_completeness_gate.py \
            --output mechanical-completeness.json

      - id: certification
        name: Export exact provider-free certification
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "status=PASS" >> "$GITHUB_OUTPUT"

      - name: Provider-free receipt
        if: always()
        run: |
          python - <<'EOF'
          import json, os, subprocess
          from pathlib import Path

          receipt = {
              "schema": "gt.central.provider-free.v1",
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "dispatch_sha": "${{ github.sha }}",
              "commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "provider_calls": 0,
              "provider_credentials_present": False,
              "mechanical_completeness": "${{ steps.certification.outputs.status || 'BLOCKED' }}",
              "mechanical_completeness_artifact": "mechanical-completeness.json",
          }
          language_receipt_path = Path(
              os.environ.get("GT_TB2_LANGUAGE_CONTRACT_RECEIPT", "")
          )
          if language_receipt_path.is_file():
              language_lines = language_receipt_path.read_text(encoding="utf-8").splitlines()
              if language_lines:
                  receipt["tb2_language_contract"] = json.loads(language_lines[-1])
                  Path("tb2_language_contract.json").write_text(
                      json.dumps(receipt["tb2_language_contract"], indent=2),
                      encoding="utf-8",
                  )
          Path("central_provider_free_receipt.json").write_text(
              json.dumps(receipt, indent=2), encoding="utf-8"
          )
          print(json.dumps(receipt))
          EOF

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-provider-free-${{ github.run_id }}
          path: |
            central_provider_free_receipt.json
            mechanical-completeness.json
            documentation-consistency.json
            tb2_language_contract.json
            decision-value-gate.json
          if-no-files-found: warn
