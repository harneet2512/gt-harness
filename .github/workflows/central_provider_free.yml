            tests/test_miniswe_smoke.py -q

      - name: Decision-value acceptance corpus
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/decision-value-v1"
          python scripts/decision_value_fixture_pilot.py \
            --corpus benchmarks/decision_value_v1/corpus.json \
            --output-dir "$proof"
          python scripts/decision_value_observe.py \
            --run "python-owner=$proof/python-owner/gt-run-receipt.json" \
            --run "typescript-owner=$proof/typescript-owner/gt-run-receipt.json" \
            --run "go-owner=$proof/go-owner/gt-run-receipt.json" \
            --run "rust-owner=$proof/rust-owner/gt-run-receipt.json" \
            --output "$proof/observations.json"
          python scripts/decision_value_gate.py \
            --expected-runs 4 \
            --run-receipts \
              "$proof/python-owner/gt-run-receipt.json" \
              "$proof/typescript-owner/gt-run-receipt.json" \
              "$proof/go-owner/gt-run-receipt.json" \
              "$proof/rust-owner/gt-run-receipt.json" \
            --corpus benchmarks/decision_value_v1/corpus.json \
            --observations "$proof/observations.json" \
            | tee decision-value-gate.json

      - name: Structural readiness audit
        run: python -m scripts.central_readiness_audit

      - name: Benchmark-integrity audit (legal evidence sources only)
        run: python scripts/central_integrity_audit.py

      - name: Exact pre-smoke release gate
        run: python scripts/central_pre_smoke_gate.py

      - name: Static checks
        run: |
          python -m ruff check gt_engine/central_runtime.py \
            gt_engine/central_controls.py \
            gt_engine/preflight.py gt_engine/provider_view.py \
            gt_engine/provider_evidence.py gt_engine/progress.py \
            gt_engine/host_execution.py gt_engine/context_frontier.py \
