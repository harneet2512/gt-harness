name: GT central provider-free certification

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Exact GT commit to certify"
        required: true
        type: string
    outputs:
      certified_commit:
        description: "Exact commit that passed source-built certification"
        value: ${{ jobs.provider_free.outputs.certified_commit }}
      mechanical_status:
        description: "Authoritative no-spend gate status"
        value: ${{ jobs.provider_free.outputs.mechanical_status }}

jobs:
  provider_free:
    runs-on: ubuntu-latest
    outputs:
      certified_commit: ${{ steps.certification.outputs.commit }}
      mechanical_status: ${{ steps.certification.outputs.status }}
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      GT_INDEX_BINARY: ${{ github.workspace }}/vendor/gt-index-linux-amd64
      SNOWFLAKE_MODEL_SHA256: 564e6c65ee0c739a486702e9e3e9b33c3f697c19c34dbe886bce9eec497ce971
      SNOWFLAKE_TOKENIZER_SHA256: 91f1def9b9391fdabe028cd3f3fcc4efd34e5d1f08c3bf2de513ebb5911a1854
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gt-index-src/go.mod
          cache-dependency-path: vendor/gt-index-src/go.sum

      - name: Build certified gt-index from the checked-out source
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index/
          chmod +x "$RUNNER_TEMP/gt-index"
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"

      - name: Go parser and spec regression tests
        working-directory: vendor/gt-index-src
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          go test ./internal/parser/ ./internal/specs/

      - name: Install exact host runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[retrieval]' "mini-swe-agent==2.4.6" "harbor==0.20.0" \
            "pytest==9.1.1" "pytest-asyncio==1.4.0" "ruff==0.16.0" \
            vendor/groundtruth_mcp-*.whl

      - name: Provision pinned Snowflake ONNX runtime asset
        run: |
          set -euo pipefail
          model_dir="$RUNNER_TEMP/snowflake-arctic-embed-m"
          mkdir -p "$model_dir"
          gh release download gt-retrieval-runtime-v1 \
            --repo harneet2512/gt-harness \
            --pattern model.onnx --pattern tokenizer.json --pattern manifest.json \
            --dir "$model_dir"
          echo "$SNOWFLAKE_MODEL_SHA256  $model_dir/model.onnx" \
            | sha256sum -c -
          echo "$SNOWFLAKE_TOKENIZER_SHA256  $model_dir/tokenizer.json" \
            | sha256sum -c -
          echo "GT_TEST_SNOWFLAKE_MODEL_DIR=$model_dir" >> "$GITHUB_ENV"

      - name: Prove repository intelligence substrate
        run: python scripts/verify_gt_index_runtime.py

      - name: Language depth audit
        run: python scripts/central_language_depth_audit.py

      - name: Prove pinned Terminal-Bench language coverage
        run: |
          set -euo pipefail
          dataset="$RUNNER_TEMP/terminal-bench-2-language-contract"
          language_receipt="$RUNNER_TEMP/tb2-language-contract.json"
          git init "$dataset"
          git -C "$dataset" remote add origin https://github.com/harbor-framework/terminal-bench-2.git
          git -C "$dataset" fetch --depth=1 origin 2fd12b88aafdd04a52c298e3940bcb189f9766d6
          git -C "$dataset" checkout --detach FETCH_HEAD
          python scripts/verify_tb2_language_contract.py --dataset-root "$dataset" \
            > "$language_receipt"
          cat "$language_receipt"
          echo "GT_TB2_LANGUAGE_CONTRACT_RECEIPT=$language_receipt" >> "$GITHUB_ENV"

      - name: Central runtime tests
        run: |
