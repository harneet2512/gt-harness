name: GroundTruth finalstand provider-free closure

on:
  workflow_dispatch:
    inputs:
      groundtruth_repository:
        description: Optional owner/repository override for the GroundTruth checkout
        required: false
        type: string
      groundtruth_ref:
        description: Immutable 40-hex GroundTruth commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  provider-free-closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
      GROUNDTRUTH_ROOT: ${{ github.workspace }}/Groundtruth
      GIT_AUTHOR_NAME: GroundTruth CI
      GIT_AUTHOR_EMAIL: groundtruth-ci@example.invalid
      GIT_COMMITTER_NAME: GroundTruth CI
      GIT_COMMITTER_EMAIL: groundtruth-ci@example.invalid
    steps:
      - name: Checkout harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: gt-harness

      - name: Validate immutable GroundTruth ref
        env:
          GROUNDTRUTH_REF: ${{ inputs.groundtruth_ref }}
        run: |
          python - <<'PY'
          import os, re, sys
          ref = os.environ.get("GROUNDTRUTH_REF", "")
          if re.fullmatch(r"[0-9a-f]{40}", ref) is None:
              print("::error::groundtruth_ref must be an immutable 40-hex commit")
              sys.exit(2)
          PY

      - name: Checkout GroundTruth
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.groundtruth_repository || format('{0}/Groundtruth', github.repository_owner) }}
          ref: ${{ inputs.groundtruth_ref }}
          path: Groundtruth

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            gt-harness/pyproject.toml
            Groundtruth/pyproject.toml

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: Groundtruth/gt-index/go.mod
          cache-dependency-path: Groundtruth/gt-index/go.sum

      - name: Install provider-free test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./Groundtruth -e './gt-harness[miniswe,eval]' pytest ruff

      - name: Prove Go registry and compatibility parity
        working-directory: Groundtruth/gt-index
        env:
          CGO_ENABLED: "1"
        run: |
          go test -tags sqlite_fts5 ./internal/specs -v
          go test -tags sqlite_fts5 ./...
          go build -tags sqlite_fts5 -o "$RUNNER_TEMP/gt-index" ./cmd/gt-index
          sudo install -D -m 0755 "$RUNNER_TEMP/gt-index" /opt/groundtruth/gt-index/gt-index
          echo "GT_INDEX_BINARY=$RUNNER_TEMP/gt-index" >> "$GITHUB_ENV"
          go run -tags sqlite_fts5 ./cmd/gt-index -language-manifest > "$RUNNER_TEMP/language-manifest.json"

      - name: Prove generated compatibility is current
        run: |
          python Groundtruth/scripts/generate_language_operation_compatibility.py \
            --output "$RUNNER_TEMP/language-operation-compatibility.json"
          cmp "$RUNNER_TEMP/language-operation-compatibility.json" \
            Groundtruth/src/groundtruth/runtime/generated_language_operation_compatibility.json

      - name: Generate and validate finalstand
        working-directory: gt-harness
        run: |
          rm -f \
            gt_finalstand/receipts/language_manifest.json \
            gt_finalstand/receipts/offline_suite.json \
            gt_finalstand/receipts/forbidden_scan.json \
            gt_finalstand/receipts/runbook_validation.json \
            gt_finalstand/receipts/experiment_dry_run.json \
            gt_finalstand/receipts/experiment_execution_plan.json
          python scripts/generate_gt_finalstand.py --check
          python scripts/finalstand_offline.py language \
            --manifest "$RUNNER_TEMP/language-manifest.json" \
            --out gt_finalstand/receipts/language_manifest.json
          python scripts/finalstand_offline.py offline \
            --cases gt_finalstand/offline_cases.json \
            --gt-index-bin "$RUNNER_TEMP/gt-index" \
            --require-terminal \
            --out gt_finalstand/receipts/offline_suite.json
          python scripts/finalstand_offline.py forbidden \
            --rules gt_finalstand/forbidden_capability_rules.json \
            --groundtruth-root "$GROUNDTRUTH_ROOT" \
            --out gt_finalstand/receipts/forbidden_scan.json
          python scripts/finalstand_offline.py runbooks \
            --out gt_finalstand/receipts/runbook_validation.json
          python scripts/phase2_experiment.py dry-run \
            --manifest gt_finalstand/phase2_experiment_manifest.json \
            --out gt_finalstand/receipts/experiment_dry_run.json
          python scripts/phase2_experiment.py plan \
            --manifest gt_finalstand/phase2_experiment_manifest.json \
            --task-manifest config/tb2_deepseek_smoke10.json \
            --inspect \
            --out gt_finalstand/receipts/experiment_execution_plan.json
          python scripts/finalstand_offline.py provenance \
            --offline-receipt gt_finalstand/receipts/offline_suite.json \
            --groundtruth-root "$GROUNDTRUTH_ROOT" \
            --gt-index-bin "$RUNNER_TEMP/gt-index" \
            --workflow .github/workflows/gt_finalstand_provider_free.yml \
            --out gt_finalstand/receipts/fs023_provenance.json
          python scripts/validate_gt_finalstand.py

      - name: Run Python closeout and harness suites
        env:
          PYTHONPATH: ${{ github.workspace }}/Groundtruth/src
        run: |
          python -m pytest gt-harness/tests -q
          python -m pytest \
            Groundtruth/tests/runtime/test_language_operation_compatibility_20260801.py \
            Groundtruth/tests/runtime/test_runtime_package_isolation_20260801.py -q
          ruff check \
            gt-harness/scripts/generate_gt_finalstand.py \
            gt-harness/scripts/validate_gt_finalstand.py \
            gt-harness/scripts/finalstand_offline.py \
            gt-harness/scripts/phase2_experiment.py \
            gt-harness/scripts/phase2_promotion.py \
            gt-harness/gt_engine/generated_typed_capabilities.py \
            gt-harness/gt_engine/miniswe_typed_actions.py

      - name: Freeze provider-free receipt
        if: always()
        env:
          FINALSTAND_JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          receipt_dir = root / "gt-harness" / "gt_finalstand" / "receipts"
          files = {}
          for path in sorted(receipt_dir.glob("*.json")):
              if path.name == "provider_free_workflow.json":
                  continue
              files[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          payload = {
              "schema": "gt.provider_free_workflow_receipt.v1",
              "ok": os.environ.get("FINALSTAND_JOB_STATUS") == "success",
              "job_status": os.environ.get("FINALSTAND_JOB_STATUS", "unknown"),
              "github_actions": os.environ.get("GITHUB_ACTIONS") == "true",
              "event_name": os.environ.get("GITHUB_EVENT_NAME", ""),
              "repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "run_id": os.environ.get("GITHUB_RUN_ID", ""),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "0")),
              "run_url": (
                  f'{os.environ.get("GITHUB_SERVER_URL", "")}/'
                  f'{os.environ.get("GITHUB_REPOSITORY", "")}/actions/runs/'
                  f'{os.environ.get("GITHUB_RUN_ID", "")}'
              ),
              "workflow_ref": os.environ.get("GITHUB_WORKFLOW_REF", ""),
              "workflow_sha": os.environ.get("GITHUB_WORKFLOW_SHA", ""),
              "harness_commit": subprocess.check_output(
                  ["git", "-C", str(root / "gt-harness"), "rev-parse", "HEAD"], text=True
              ).strip(),
              "groundtruth_commit": subprocess.check_output(
                  ["git", "-C", str(root / "Groundtruth"), "rev-parse", "HEAD"], text=True
              ).strip(),
              "receipt_inputs": files,
          }
          (receipt_dir / "provider_free_workflow.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Build content-addressed provider-free bundle
        run: |
          python - <<'PY'
          import os, pathlib, zipfile
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          harness = root / "gt-harness"
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          entries = []
          for path in sorted((harness / "gt_finalstand" / "receipts").glob("*.json")):
              entries.append((f"receipts/{path.name}", path.read_bytes()))
          entries.extend(
              [
                  (
                      ".github/workflows/gt_finalstand_provider_free.yml",
                      (harness / ".github" / "workflows" / "gt_finalstand_provider_free.yml").read_bytes(),
                  ),
                  (
                      "language_operation_compatibility.json",
                      (harness / "gt_finalstand" / "language_operation_compatibility.json").read_bytes(),
                  ),
                  ("language-manifest.json", (temp / "language-manifest.json").read_bytes()),
              ]
          )
          output = temp / "provider-free-bundle.zip"
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as archive:
              for name, content in entries:
                  info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, content)
          PY

      - name: Upload provider-free receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gt-finalstand-provider-free-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-free-bundle.zip
          if-no-files-found: error
