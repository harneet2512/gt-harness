console_entry_points = ["gt-harness=gt_harness.cli:main"]

benchmark_adapters = [
  "eval.harbor_gt_harness_adapter",
  "eval.pier_gt_harness_adapter",
  "eval.swe_live_lite_gt_harness_adapter",
]

dispatchable_workflows = [
  "deepswe_gt_harness_product.yml",
  "prerelease_product_matrix.yml",
  "repository_intelligence_audit.yml",
  "swe_live_lite_gt_harness_product.yml",
  "tb2_miniswe_product.yml",
]

forbidden_modules = [
  "eval.gt_central_agent",
  "eval.pier_gt_adapter",
  "gt_engine.bridge",
  "gt_engine.engine",
  "groundtruth",
]

[schemas]
graph_receipt = "gt.graph_receipt.v5"
repository_architecture = "gt.repository_architecture.v1"
agent_context = "gt.agent_context.v7"
provider_delivery = "gt.provider_delivery.v2"
treatment_receipt = "gt.treatment_receipt.v4"
benchmark_product_contract = "gt.benchmark_product_contract.v2"
feature_lifecycle = "gt.feature_lifecycle.v2"
delivery_uptake = "gt.delivery_uptake.v1"

[budgets]
initial_tokens = 500
update_tokens = 350
total_tokens = 1200
max_deliveries = 4
max_updates = 3

[languages]
structural_certification_candidates = [
  "python",
  "javascript",
  "typescript",
  "go",
  "rust",
  "java",
]
semantic_certification_candidates = ["python"]
