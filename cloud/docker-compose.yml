# GT cloud coding agent.
#
#   bash cloud/deploy.sh            # pull, rebuild, stamp, verify — use this
#
# By hand (--build is NOT optional: without it compose happily reuses a stale
# image and serves a UI several commits behind the server):
#
#   export BUILD_SHA="$(git rev-parse --short HEAD)"
#   docker compose -f cloud/docker-compose.yml up -d --build
#   docker compose -f cloud/docker-compose.yml --profile build build sandbox-image
#
# Sandboxing (SANDBOX_MODE=docker) is on by default here. The server manages
# one `gt-sandbox-<session_id>` container per session through the host's Docker
# socket; those containers sit on the INTERNAL `gt-sandbox-net`, whose only
# route off-net is the allow-listed `egress-proxy` below.
services:
  server:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-unknown}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
      # The server manages sandbox containers with the docker CLI.
      - /var/run/docker.sock:/var/run/docker.sock
      # SAME PATH ON BOTH SIDES, deliberately. A sandbox bind-mounts the
      # session workspace, and the daemon resolves that path on the HOST, not
      # inside this container. Mounting it at the same absolute path makes the
      # path the server writes and the path the daemon binds identical, so
      # WORKSPACES_DIR needs no translation.
      - ${WORKSPACES_HOST_DIR:-/srv/gt-workspaces}:${WORKSPACES_HOST_DIR:-/srv/gt-workspaces}
    environment:
      - DB_PATH=/app/data/cloud_harness.db
      - WORKSPACES_DIR=${WORKSPACES_HOST_DIR:-/srv/gt-workspaces}
      - SANDBOX_MODE=${SANDBOX_MODE:-docker}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-gt-sandbox:latest}
      - SANDBOX_NETWORK=gt-sandbox-net
      - SANDBOX_PROXY_CONTAINER=gt-egress-proxy
      - SANDBOX_PROXY_URL=http://gt-egress-proxy:3128
      - SANDBOX_ALLOW_REGISTRIES=${SANDBOX_ALLOW_REGISTRIES:-1}
      - SANDBOX_EGRESS_ALLOW=${SANDBOX_EGRESS_ALLOW:-}
    depends_on:
      - egress-proxy

  # The only way out of the sandbox network. On both networks by design: the
  # internal one to be reachable, the default one to have somewhere to forward.
  egress-proxy:
    build:
      context: sandbox/proxy
    image: gt-egress-proxy:latest
    container_name: gt-egress-proxy
    restart: unless-stopped
    environment:
      - EGRESS_PROXY_PORT=3128
      - EGRESS_ALLOW_REGISTRIES=${SANDBOX_ALLOW_REGISTRIES:-1}
      - EGRESS_ALLOW=${SANDBOX_EGRESS_ALLOW:-}
    networks:
      sandbox-internal:
        aliases:
          - egress-proxy
      default: {}

  # Build-only: `--profile build` builds the per-session sandbox image. It is
  # never started as a service — the server runs it, one container per session.
  sandbox-image:
    build:
      context: sandbox
    image: ${SANDBOX_IMAGE:-gt-sandbox:latest}
    profiles:
      - build
    command: ["true"]

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
      args:
        BUILD_SHA: ${BUILD_SHA:-dev}
    ports:
      - "80:80"
    depends_on:
      - server

networks:
  # internal: no route off the host, no external DNS. Sandboxes live here.
  sandbox-internal:
    name: gt-sandbox-net
    internal: true
  default: {}

volumes:
  db-data:
