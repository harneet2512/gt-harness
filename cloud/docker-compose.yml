services:
  server:
    build:
      context: ..
      dockerfile: cloud/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - db-data:/app/data
    environment:
      - DB_PATH=/app/data/cloud_harness.db

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  db-data:
