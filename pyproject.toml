[project]
name = "gt-harness"
version = "0.9.0"
description = "Model-agnostic benchmark harness with deterministic repository intelligence."
requires-python = ">=3.12"
dependencies = [
  "mini-swe-agent==2.4.6",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "rich==15.0.0",
  "structlog>=24.0.0,<26.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis==6.165.0",
  "psutil==7.2.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-timeout==2.4.0",
  "ruff==0.16.0",
  "zstandard==0.25.0",
]
eval = ["harbor==0.20.0", "swebench==4.1.0"]
# GroundTruth is first-party source in src/groundtruth. NumPy remains optional:
# the bounded task-start brief abstains correct-or-quiet when it is unavailable.
gt = ["numpy==2.5.1"]
# Local dense retrieval used by the ARB workflow and optional runtime seam.
# The model weights are separately content-addressed; these are inference-only
# packages and never contact a provider.
retrieval = [
  "numpy==2.5.1",
  "onnxruntime==1.28.0",
  "tokenizers==0.23.1",
]

[project.scripts]
gt-harness = "gt_harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval", "gt_engine", "gt_harness", "src/groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
  "external_evidence: requires a pinned external benchmark package or hosted historical artifact and is excluded from provider-free product certification",
  "gt_all17: deterministic ten-trigger campaign covering all 17 GT identities",
  "real_graph: exercises the source-built Go indexer against a real repository",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
